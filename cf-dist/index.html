<!-- Preload logo so it appears instantly when React mounts. The WebP is 19 KB
     against the PNG's 160 KB, which on a first visit over 3G is most of a
     second on the highest-priority image on the page. `type` keeps a browser
     that cannot read WebP from preloading something it will not use; the PNG is
     still there, first in the fallback chain below, and is still what the
     structured data, the manifest and share cards point at. -->
<link rel="preload" as="image" href="assets/nemo-logo.webp" type="image/webp" fetchpriority="high"/>
<script>
  /* Ordered fallbacks for the splash logo; each onerror advances one step. */
  (function(){
    var step=0;
    /* The PNG leads: the splash asks for the WebP, so the first step is the
       one that answers "this browser has no WebP" as well as "that file is
       missing". After that, past the cache, then the app icon. */
    var tries=["assets/nemo-logo.png","assets/nemo-logo.png?retry=1","assets/favicon-192.png"];
    window.__nemoLogoFallback=function(img){
      if(step<tries.length){ img.src=tries[step++]; return; }
      img.style.display="none";
      var fb=img.parentNode&&img.parentNode.querySelector(".emoji-fallback");
      if(fb) fb.style.display="block";
    };
  })();
</script>
<!-- Preload the precompiled bundle so it's ready the moment the page is interactive.
     `crossorigin` on its own means "anonymous", whose credentials mode is
     same-origin — which is exactly what the plain fetch("app.js") below uses,
     so the preload is reused. A preload is only reused when its credentials
     mode matches the request that follows it, and a mismatch is silent: the
     browser just downloads the whole 850 KB bundle a second time. Dropping this
     attribute, or passing credentials to that fetch, does it. Don't touch one
     without the other — scripts/check-firstpaint.mjs counts the downloads. -->
<link rel="preload" href="app.js" as="fetch" crossorigin/>

<!-- Fonts: load async (media=print trick), so they never block first paint of the splash.
     The splash then WAITS for the faces before it lifts (see the fontsReady gate in app.jsx).
     A webfont that swaps in after the store is already visible re-renders every line of text
     on the page at once, and on a cold load that is the most visible flicker a shopper gets.
     The wait is bounded there, so a font that never arrives cannot hold the store. -->
<script>
  window.__nemoFontsReady = false;
  window.nemoFontsDone = function(){
    if (window.__nemoFontsReady) return;
    window.__nemoFontsReady = true;
    try { window.dispatchEvent(new Event("nemo-fonts-ready")); } catch(e) {}
  };
  window.nemoFontCssLoaded = function(link){
    try { link.media = "all"; } catch(e) {}
    var f = document.fonts;
    /* No Font Loading API (or the stylesheet failed): nothing to wait for, so do not make
       anyone wait. The page still renders, in the fallback stack. */
    if (!f || !f.load) { window.nemoFontsDone(); return; }
    /* Named faces, not the `fonts.ready` promise, which resolves as soon as nothing is pending —
       and at this instant nothing is, because the @font-face rules have only just become
       active. Asking for the two weights above the fold is what makes this wait for the font
       FILES rather than for the CSS that mentions them. */
    Promise.all([f.load("400 1rem 'Plus Jakarta Sans'"), f.load("800 1rem 'Plus Jakarta Sans'")])
      .then(window.nemoFontsDone, window.nemoFontsDone);
  };
</script>
<link rel="stylesheet" media="print" onload="nemoFontCssLoaded(this)" onerror="nemoFontsDone()" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"/>
<style>
  html,body,#root{height:100%;margin:0;padding:0;background:#ffffff;}

  #splash .b1{left:12%;width:14px;height:14px;animation-duration:5.5s;}
  #splash .b2{left:26%;width:8px;height:8px;animation-duration:4.2s;animation-delay:.8s;}
  #splash .b3{left:44%;width:18px;height:18px;animation-duration:6.5s;animation-delay:.3s;}

  #splash .logo::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.35) 50%,transparent 62%);

  /* A determinate bar, not a spinner. An indeterminate ring says only "still working"; on a
     slow connection that is indistinguishable from a hang, which is when people leave. The
     percentage is driven by real boot milestones reported from the app (see nemoSplashProgress
     below), with a slow creep in between so it is never frozen while the network is quiet. */
  #splash .prog{width:min(210px,58vw);margin-top:14px;opacity:0;animation:fadeIn .5s ease 1.1s both;}

     Cache key is a hash of app.jsx, so any code change auto-recompiles. Cache API is used (not
     localStorage) because the app already uses localStorage for image caching. -->
<script>
(function(){
  // There is deliberately no display-duration timer. The cinematic opening remains only
  // while NemoStore completes its initial catalogue, settings, community and wallet reads,

      ctx.arc(e2x,e2y-s*0.05,Math.max(1,s*0.08),0,Math.PI*2); ctx.fillStyle='#12303a'; ctx.fill();
    }
    // shell
    var sh=ctx.createRadialGradient(-s*0.15,-s*0.35,s*0.1,0,-s*0.15,s*0.95);
    sh.addColorStop(0,'rgba(255,206,120,1)'); sh.addColorStop(1,'rgba(214,140,52,1)');
    ctx.beginPath(); ctx.arc(0,-s*0.15,s*0.8,0,Math.PI*2); ctx.fillStyle=sh; ctx.fill();
    // spiral
    ctx.strokeStyle='rgba(150,90,30,0.8)'; ctx.lineWidth=Math.max(1,s*0.1);
    ctx.beginPath(); ctx.arc(0,-s*0.15,s*0.5,0,Math.PI*1.6); ctx.stroke();
    ctx.beginPath(); ctx.arc(s*0.08,-s*0.05,s*0.22,0,Math.PI*2); ctx.stroke();
    ctx.restore(); ctx.globalAlpha=1;
  }
  function nudge(o,px,py,R,strength){
    if(!mouse.active) return;
    var dx=(px+o.ox)-mouse.x, dy=(py+o.oy)-mouse.y, d=Math.hypot(dx,dy);
    if(d<R&&d>0.01){ var f=(1-d/R)*strength; o.ox+=(dx/d)*f; o.oy+=(dy/d)*f; }
    o.ox*=0.90; o.oy*=0.90;
  }
  function loop(){
    if(!running){ looping=false; return; }
    ctx.clearRect(0,0,W,H); bg();
    for(var i=0;i<bubbles.length;i++){
      var b=bubbles[i];
      b.phase+=0.006*b.sway; b.y+=b.vy;
      var sx=b.x+Math.sin(b.phase)*b.swayA;
      if(mouse.active){
        var dx=(sx+b.ox)-mouse.x, dy=(b.y+b.oy)-mouse.y, d=Math.hypot(dx,dy), R=130;
        if(d<R&&d>0.01){ var f=(1-d/R)*4; b.ox+=(dx/d)*f; b.oy+=(dy/d)*f; }
      }
      b.ox*=0.90; b.oy*=0.90;
      if(b.y+b.r<-20){ Object.assign(b,mk()); b.y=H+b.r+Math.random()*40; }
      drawBubble(sx+b.ox,b.y+b.oy,b.r,b.alpha);
    }
    drawPops();
    // snails crawl the walls; touching one makes it duck into its shell for 5s, then reverse
    for(var s=0;s<snails.length;s++){
      var sn=snails[s]; sn.phase+=0.03;
      var wob=Math.abs(Math.sin(sn.phase))*1.5, px,py,rot;
      if(sn.wall==='bottom'){ px=30+sn.t*(W-60); py=H-8-wob; rot=0; }
      else if(sn.wall==='left'){ px=8+wob; py=30+sn.t*(H-60); rot=Math.PI/2; }
      else { px=W-8-wob; py=30+sn.t*(H-60); rot=-Math.PI/2; }
      var now=(window.performance&&performance.now)?performance.now():Date.now();
      if(mouse.active && sn.state==='crawl'){
        var dd=Math.hypot(px-mouse.x,py-mouse.y);
        if(dd<58){ sn.state='hiding'; sn.hideUntil=now+5000; sn.dir=-sn.dir; }
      }
      if(sn.state==='hiding'){
        sn.eyeOut+=(0-sn.eyeOut)*0.18;      // pull eyes in
        if(now>=sn.hideUntil){ sn.state='crawl'; }
      } else {
        sn.eyeOut+=(1-sn.eyeOut)*0.04;      // slowly push eyes back out
        var speed=sn.v*Math.max(0,sn.eyeOut-0.2);
        sn.t+=sn.dir*speed/((sn.wall==='bottom'?W:H)||1);
        if(sn.t>1){ sn.t=1; sn.dir=-1; } if(sn.t<0){ sn.t=0; sn.dir=1; }
      }
      var facing=(sn.wall==='right')?-sn.dir:sn.dir; // right wall is mirror-handed — flip so eyes lead
      drawSnail(px, py, sn.s, facing, sn.alpha, rot, sn.eyeOut);
    }
    // fish glide slowly — betta toward the cursor, clownfish away — both drifting & wavy
    for(var f=0;f<fish.length;f++){
      var fs=fish[f]; fs.phase+=0.025; fs.wag+=0.05;
      if(fs.flee){
        if(mouse.active){
          var rx=fs.x-mouse.x, ry=fs.y-mouse.y, rd=Math.hypot(rx,ry), R=230;
          if(rd<R&&rd>0.01){ var rf=(1-rd/R)*0.05; fs.vx+=(rx/rd)*rf; fs.vy+=(ry/rd)*rf; }
        }
        var ax=(fs.tx-fs.x), ay=(fs.ty-fs.y), ad=Math.hypot(ax,ay);
        if(ad<50){ fs.tx=40+Math.random()*(W-80); fs.ty=H*0.1+Math.random()*(H*0.72); }
        else { fs.vx+=(ax/ad)*0.005; fs.vy+=(ay/ad)*0.005; }
      } else {
        if(mouse.active){ fs.tx=mouse.x; fs.ty=mouse.y; }
        var bx=(fs.tx-fs.x), by=(fs.ty-fs.y), bd=Math.hypot(bx,by);
        if(bd<40){ if(!mouse.active){ fs.tx=40+Math.random()*(W-80); fs.ty=H*0.1+Math.random()*(H*0.72); } }
        else { fs.vx+=(bx/bd)*0.006; fs.vy+=(by/bd)*0.006; }
      }
      // soft walls keep them on-screen
      var m=34;
      if(fs.x<m) fs.vx+=0.02; else if(fs.x>W-m) fs.vx-=0.02;
      if(fs.y<m) fs.vy+=0.02; else if(fs.y>H-m) fs.vy-=0.02;
      var sp=Math.hypot(fs.vx,fs.vy), MAX=0.42;
      if(sp>MAX){ fs.vx*=MAX/sp; fs.vy*=MAX/sp; }
      fs.vx*=0.99; fs.vy*=0.99;
      fs.x+=fs.vx; fs.y+=fs.vy+Math.sin(fs.phase)*0.10;
      var dir=fs.vx>0?-1:1; // image faces left
      var tilt=Math.max(-0.26,Math.min(0.26,fs.vy*0.5));
      drawFish(fs.img, fs.x, fs.y, fs.w, dir, tilt, fs.alpha, fs.wag);

  }
  /* Tapping a bubble pops it. The wallpaper is pointer-events:none so it can never swallow a
     tap meant for the app — the hit test just reads the same pointer position the drift already
     tracks, and only the nearest bubble under the finger bursts. A generous slop radius makes it
     land on a touchscreen, where the finger is far bigger than a 6px bubble. */
  function popAt(px,py){
    var best=-1, bestD=1e9;
    for(var i=0;i<bubbles.length;i++){
      var b=bubbles[i];
      var bx=b.x+Math.sin(b.phase)*b.swayA+b.ox, by=b.y+b.oy;
      var d=Math.hypot(bx-px,by-py);
      if(d<b.r+16 && d<bestD){ bestD=d; best=i; }
    }
    if(best<0) return false;
    var v=bubbles[best];
    pops.push({x:v.x+Math.sin(v.phase)*v.swayA+v.ox, y:v.y+v.oy, r:v.r, t:0});
    // Retire the popped bubble and send a fresh one up from below, so the count stays steady.
    Object.assign(v,mk()); v.y=H+v.r+Math.random()*40;
    return true;
  }
  function drawPops(){
    for(var i=pops.length-1;i>=0;i--){
      var p=pops[i]; p.t+=0.045;
      if(p.t>=1){ pops.splice(i,1); continue; }
      var e=1-Math.pow(1-p.t,2);          // fast out, slow settle
      var a=(1-p.t)*0.55;
      // the shell blowing outwards
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r*(1+e*1.9),0,Math.PI*2);
      ctx.strokeStyle='rgba(52,168,202,'+a+')'; ctx.lineWidth=Math.max(1.2,p.r*0.34*(1-p.t)); ctx.stroke();
      // and the droplets it throws off
      for(var k=0;k<6;k++){
        var ang=(Math.PI*2/6)*k+p.r, dist=p.r*(0.9+e*2.4);
        ctx.beginPath();
        ctx.arc(p.x+Math.cos(ang)*dist, p.y+Math.sin(ang)*dist, Math.max(0.6,p.r*0.22*(1-p.t)), 0, Math.PI*2);
        ctx.fillStyle='rgba(74,187,220,'+(a*1.5)+')'; ctx.fill();
      }
    }
  }
  window.addEventListener('pointerdown',function(e){ mouse.x=e.clientX; mouse.y=e.clientY; mouse.active=true; popAt(e.clientX,e.clientY); },{passive:true});
  window.addEventListener('resize',resize,{passive:true});
  window.addEventListener('pointermove',function(e){ mouse.x=e.clientX; mouse.y=e.clientY; mouse.active=true; },{passive:true});
  window.addEventListener('pointerout',function(e){ if(!e.relatedTarget){ mouse.active=false; } });
  // start the loop at most once — prevents multiple rAF loops stacking (which made the fish speed up over time)
  function start(){ if(looping||!running||reduce) return; looping=true; requestAnimationFrame(loop); }
  document.addEventListener('visibilitychange',function(){ running=!document.hidden; if(running) start(); });
  resize();
  if(reduce){ ctx.clearRect(0,0,W,H); bg();
    for(var i=0;i<bubbles.length;i++){ var b=bubbles[i]; drawBubble(b.x,b.y,b.r,b.alpha); }
    drawSnail(W*0.4,H-8,14,1,0.6,0,1);
    (function(){
      var w=window.innerWidth<560?Math.max(44,Math.round(window.innerWidth*0.14)):78;
      loadFish();
      var rdz=function(){ drawFish(bettaImg,W*0.55,H*0.32,w,1,0,0.92,0); drawFish(clownImg,W*0.7,H*0.5,Math.round(w*0.92),-1,0,0.92,0); };
      bettaImg.onload=rdz; clownImg.onload=rdz; rdz();
    })();
  }
  else { start(); }
})();
</script>

<!-- ══ Drifting jellyfish — a couple at a time, crossing slowly from bottom→top ══
     Each one enters at a random point along the bottom and leaves at a different random point
     along the top, wandering rather than ruling a line between them. Built as an SVG (not a
     flat image) so the bell can actually contract and the tentacles trail: a real jellyfish
     swims by squeezing its bell to surge, then glides while it relaxes. -->
<div id="nemo-jelly" aria-hidden="true"></div>
<style>
  #nemo-jelly{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;}
  #nemo-jelly svg{position:absolute;left:0;top:0;will-change:transform;}
  /* Fine ripple along each tentacle, staggered so they don't move as one rigid comb. */
  @keyframes jellyTentacle{0%,100%{transform:translateX(0) scaleY(1)}50%{transform:translateX(2.5px) scaleY(1.05)}}
  .jt{transform-box:fill-box;transform-origin:top center;animation:jellyTentacle 4.6s ease-in-out infinite;}
  @media(prefers-reduced-motion:reduce){#nemo-jelly{display:none;}}
</style>
<script>
(function(){
  var host=document.getElementById('nemo-jelly'); if(!host) return;

  // Kawaii jellyfish: lavender→mint bell, star sparkle, blushed cheeks, ruffled oral arms
  // and eight long tentacles. Grouped so the bell, arms and tentacles animate separately.
  function svg(uid){
    var g='jg'+uid, t='jt'+uid, a='ja'+uid;

    '<svg width="200" height="330" viewBox="0 0 200 330" fill="none" xmlns="http://www.w3.org/2000/svg">'+
      '<defs>'+
        '<linearGradient id="'+g+'" x1="0" y1="0" x2="0" y2="1">'+
          '<stop offset="0%" stop-color="#cdb4ec"/><stop offset="45%" stop-color="#bcc8ee"/>'+
          '<stop offset="100%" stop-color="#a8e6cf"/></linearGradient>'+
        '<linearGradient id="'+t+'" x1="0" y1="0" x2="0" y2="1">'+
          '<stop offset="0%" stop-color="#c9b6e8"/><stop offset="100%" stop-color="#fbf0c4"/></linearGradient>'+
        '<linearGradient id="'+a+'" x1="0" y1="0" x2="0" y2="1">'+
          '<stop offset="0%" stop-color="#d8c8f0"/><stop offset="100%" stop-color="#fdf3cc"/></linearGradient>'+
      '</defs>'+
      '<g class="jelly-tents" opacity=".95">'+
        // long outer tentacles — drawn first so they sit behind the bell
        '<path class="jt" style="animation-delay:-0.0s"  d="M55 118c-14 34-22 76-16 116 4 27 1 46-9 58" stroke="url(#'+t+')" stroke-width="7" stroke-linecap="round" fill="none"/>'+
        '<path class="jt" style="animation-delay:-0.6s"  d="M74 122c-9 40-13 84-6 122 4 24 2 40-6 52" stroke="url(#'+t+')" stroke-width="7" stroke-linecap="round" fill="none"/>'+
        '<path class="jt" style="animation-delay:-1.2s"  d="M92 126c-4 44-5 90 1 126 3 22 1 36-5 46" stroke="url(#'+t+')" stroke-width="7" stroke-linecap="round" fill="none"/>'+
        '<path class="jt" style="animation-delay:-1.8s"  d="M110 126c4 44 5 90-1 126-3 22-1 36 5 46" stroke="url(#'+t+')" stroke-width="7" stroke-linecap="round" fill="none"/>'+
        '<path class="jt" style="animation-delay:-2.4s"  d="M128 122c9 40 13 84 6 122-4 24-2 40 6 52" stroke="url(#'+t+')" stroke-width="7" stroke-linecap="round" fill="none"/>'+
        '<path class="jt" style="animation-delay:-3.0s"  d="M147 118c14 34 22 76 16 116-4 27-1 46 9 58" stroke="url(#'+t+')" stroke-width="7" stroke-linecap="round" fill="none"/>'+
      '</g>'+
      '<g class="jelly-arms">'+
        // ruffled oral arms in the middle
        '<path d="M84 120c-10 22-16 46-13 70 2 18-2 34-9 46 12-4 20-16 24-30 5-18 8-42 6-64z" fill="url(#'+a+')" stroke="#6b4a8f" stroke-width="3.4" stroke-linejoin="round"/>'+
        '<path d="M118 120c10 22 16 46 13 70-2 18 2 34 9 46-12-4-20-16-24-30-5-18-8-42-6-64z" fill="url(#'+a+')" stroke="#6b4a8f" stroke-width="3.4" stroke-linejoin="round"/>'+
        '<path d="M101 124c-6 26-8 56-4 82 3 18 1 32-4 42 10-6 16-18 18-34 3-24 2-62-2-90z" fill="url(#'+a+')" stroke="#6b4a8f" stroke-width="3.4" stroke-linejoin="round"/>'+
      '</g>'+
      '<g class="jelly-bell">'+
        // dome with a scalloped hem
        '<path d="M14 104c0-48 39-86 86-86s86 38 86 86c0 12-2 20-5 24-6 2-11-2-14-6-4 6-10 10-16 10s-12-4-16-10c-4 6-10 10-16 10s-12-4-16-10c-4 6-10 10-16 10s-12-4-16-10c-4 6-10 10-16 10s-12-4-16-10c-3 4-8 8-14 6-3-4-5-12-5-24z" fill="url(#'+g+')" stroke="#5b3a7a" stroke-width="4.2" stroke-linejoin="round"/>'+

        '<path d="M44 76c6-22 23-37 41-41-15 11-26 26-30 45-2.5 9-13.5 6.5-11-4z" fill="#fff" opacity=".75"/>'+
        // sparkles
        '<path d="M144 44l3.4 7.2 7.6 1-5.6 5.6 1.4 7.8-6.8-3.8-6.8 3.8 1.4-7.8-5.6-5.6 7.6-1z" fill="#fff" opacity=".92"/>'+
        '<circle cx="155" cy="72" r="2.6" fill="#fff" opacity=".8"/>'+
        // face — blush sits behind the eyes, sparkles tucked inside the iris
        '<ellipse cx="49" cy="99" rx="13" ry="7.5" fill="#c9a8e8" opacity=".72"/>'+
        '<ellipse cx="151" cy="99" rx="13" ry="7.5" fill="#c9a8e8" opacity=".72"/>'+
        '<ellipse cx="74" cy="78" rx="15" ry="17.5" fill="#3d2352"/>'+
        '<ellipse cx="126" cy="78" rx="15" ry="17.5" fill="#3d2352"/>'+
        '<circle cx="68" cy="70" r="4.8" fill="#fff"/><circle cx="120" cy="70" r="4.8" fill="#fff"/>'+
        '<path d="M81 85l1.5 3.1 3.4.5-2.5 2.4.6 3.4-3-1.6-3 1.6.6-3.4-2.5-2.4 3.4-.5z" fill="#f7d774"/>'+
        '<path d="M133 85l1.5 3.1 3.4.5-2.5 2.4.6 3.4-3-1.6-3 1.6.6-3.4-2.5-2.4 3.4-.5z" fill="#f7d774"/>'+
        // open smile with a tongue, sat below and between the eyes
        '<path d="M88 95c4 1.2 20 1.2 24 0 0 9-5.5 14.5-12 14.5S88 104 88 95z" fill="#3d2352"/>'+
        '<path d="M94.5 105c1.8 2.6 9.2 2.6 11 0 .4 4.4-2.6 7-5.5 7s-5.9-2.6-5.5-7z" fill="#f79fb0"/>'+
      '</g>'+
    '</svg>';
  }

  // ── Pointer / touch: getting close wakes it up ─────────────────────────────
  // The layer is pointer-events:none (it must never eat a tap), so proximity is measured
  // against the pointer rather than using hover. A tap stays "hot" for a moment, since a
  // touch is instantaneous and otherwise nothing would register.
  var ptr={x:-9999,y:-9999,until:0};
  function markPtr(x,y,ms){ ptr.x=x; ptr.y=y; ptr.until=(performance.now?performance.now():Date.now())+ms; }
  window.addEventListener('pointermove',function(e){ markPtr(e.clientX,e.clientY,220); },{passive:true});
  window.addEventListener('pointerdown',function(e){ markPtr(e.clientX,e.clientY,1600); },{passive:true});
  window.addEventListener('touchstart',function(e){ var t=e.touches&&e.touches[0]; if(t) markPtr(t.clientX,t.clientY,1600); },{passive:true});
  window.addEventListener('touchmove',function(e){ var t=e.touches&&e.touches[0]; if(t) markPtr(t.clientX,t.clientY,400); },{passive:true});

  // ── A couple of drifters, each on its own crossing ─────────────────────────
  // Each slot runs an independent cycle: spawn → cross → leave → wait → spawn again. Keeping
  // them in separate slots means one leaving never disturbs the other's climb, and they drift
  // out of step on their own instead of rising as a matched pair.
  var MAX=2;
  var uid=0, live=[], slots=[], raf=0, running=true, last=0, seeded=false;
  for(var si=0; si<MAX; si++) slots.push({d:null, at:0});

  // Two entering side by side reads as a pair rather than as drift, so a new one keeps clear
  // of whatever is already in the water.
  function crowded(x,W){
    for(var i=0;i<live.length;i++) if(Math.abs(live[i].cx-x)<W*0.3) return true;
    return false;
  }

  function spawn(){
    uid++;
    var W=window.innerWidth, H=window.innerHeight;
    // The betta and clownfish in the wallpaper render 72-78px wide; keep this well under half
    // of that. The bell is ~86% of the SVG width, so a 34px svg gives a ~29px bell.
    var w=26+Math.random()*7, h=w*(330/200);
    var box=document.createElement('div');
    box.innerHTML=svg(uid);
    var el=box.firstChild;
    host.appendChild(el);                          // append — never wipe the other drifter
    el.style.width=w+'px'; el.style.height=h+'px';
    // Like the fish in the wallpaper, it crosses: enters at a random point along the bottom and
    // leaves at a different random point along the top. Both ends can land anywhere across the
    // width, so over a few drifters the whole screen gets used.
    var m=w*0.6, span=Math.max(40,W-w*1.2), x0=m+Math.random()*span;
    // A handful of tries to find a clear entry; on a window too narrow to separate them, take
    // whatever came up rather than spin.
    for(var a=0; a<8 && crowded(x0,W); a++) x0=m+Math.random()*span;
    // How far sideways it wants to end up — always a visible crossing, never a near-vertical
    // line. If that would run it off one edge, send it the other way instead.
    var reach=Math.max(60,W*0.18)+Math.random()*span*0.55, dir=Math.random()<0.5?-1:1;
    var x1=x0+dir*reach;
    if(x1<m||x1>m+span) x1=x0-dir*reach;
    x1=Math.min(m+span,Math.max(m,x1));
    var y0=H+h*0.6;                                // start just below the bottom edge
    var jf={
      el:el, w:w, h:h,
      y:y0, y0:y0,
      travel:y0-(-h-10),                           // bottom edge → clear off the top
      x0:x0, x1:x1, cx:x0, baseCx:x0, push:0, pushDir:0,
      // It doesn't rule a straight line between the two — it meanders there. Two slow waves at
      // unrelated rates never repeat the same shape twice, so each crossing wanders differently.
      wan:Math.min(W*0.20,55+Math.random()*80),    // how wide the meander swings, in px
      wf1:0.8+Math.random()*1.1,                   // slow swings per crossing
      wf2:2.2+Math.random()*1.9,                   // faster ripple riding on top
      wp1:Math.random()*Math.PI*2,
      wp2:Math.random()*Math.PI*2,
      lastCx:x0, vxs:0,                            // smoothed sideways speed, for the bank
      amp:4+Math.random()*3,                       // fine jitter on top of the meander
      swayHz:0.012+Math.random()*0.008,            // under one slow cycle across the whole rise
      swayPh:Math.random()*Math.PI*2,
      pulseT:Math.random(),                        // where in the swim stroke it starts
      pulseDur:2.5+Math.random()*0.9,              // seconds per contraction cycle
      rise:12+Math.random()*3,                     // net px/sec after the coast — just above the bubbles
      act:0,                                       // 0 = calm drift, 1 = stirred up by the pointer
      bell:el.querySelector('.jelly-bell'),
      arms:el.querySelector('.jelly-arms'),
      tents:el.querySelector('.jelly-tents')
    };
    // keep the artwork's own origin sensible for squash/stretch
    if(jf.bell){ jf.bell.style.transformBox='fill-box'; jf.bell.style.transformOrigin='center bottom'; }
    if(jf.arms){ jf.arms.style.transformBox='fill-box'; jf.arms.style.transformOrigin='top center'; }
    if(jf.tents){ jf.tents.style.transformBox='fill-box'; jf.tents.style.transformOrigin='top center'; }
    live.push(jf);
    return jf;
  }

  // One drifter, one frame. Returns false once it has cleared the top and is done.
  function step(jf,dt,now,W){
    // Where it sits this frame. The start and end lanes only set the overall trend — between
    // them it meanders, drifting off one way and then back, the way something with no say in
    // where the water takes it does. The envelope pins the wander to zero at both ends so it
    // still enters and leaves on the lanes it was given.
    var t=(jf.y0-jf.y)/jf.travel; if(t<0)t=0; else if(t>1)t=1;
    var ease=t*t*(3-2*t);                 // smoothstep — no corner at either end of the crossing
    var env=Math.sin(Math.PI*t);
    var wander=(Math.sin(t*Math.PI*2*jf.wf1+jf.wp1)*0.6+
                Math.sin(t*Math.PI*2*jf.wf2+jf.wp2)*0.4)*jf.wan*env;
    jf.swayPh+=dt*Math.PI*2*jf.swayHz;
    var sway=Math.sin(jf.swayPh);
    var base=jf.x0+(jf.x1-jf.x0)*ease+wander+sway*jf.amp;
    jf.baseCx=base;
    // Their meanders are independent, so two of them can converge mid-screen — which reads as a
    // collision, not as drift. Ease them apart as they close: nothing at arm's length, growing
    // smoothly the nearer they get, and both feel it so the gap opens twice as fast.
    // Measured between the un-nudged paths, so the nudge can't keep re-deciding its own size,
    // and the side is settled once on first approach — recompute it every frame and the
    // direction inverts the instant they cross, which snaps them apart instead of parting them.
    var want=0, meeting=false;
    for(var q=0;q<live.length;q++){
      var o=live[q]; if(o===jf) continue;
      var ddx=base-o.baseCx, dist=Math.hypot(ddx,jf.y-o.y), R=280;
      if(dist<R){
        meeting=true;
        if(!jf.pushDir) jf.pushDir=(ddx||(jf.x0-o.x0)||1)>0?1:-1;   // commit to a side
        var f=1-dist/R;
        want+=jf.pushDir*f*f*40;
      }
    }
    if(!meeting) jf.pushDir=0;            // clear of each other — ready to decide afresh
    jf.push+=(want-jf.push)*0.04;
    var cx=base+jf.push;
    // The meander must never carry it off the edge, whatever the window is doing right now.
    var lo=jf.w*0.6, hi=Math.max(lo,W-jf.w*0.6);
    if(cx<lo) cx=lo; else if(cx>hi) cx=hi;
    jf.cx=cx;                             // published so the next spawn can keep its distance
    var x=cx-jf.w/2;
    // Banks toward wherever it's actually heading — smoothed, so the tilt follows the drift
    // rather than twitching frame to frame.
    var vx=(cx-jf.lastCx)/Math.max(dt,0.001); jf.lastCx=cx;
    jf.vxs+=(vx-jf.vxs)*0.06;
    var lean=Math.max(-8,Math.min(8,jf.vxs*0.30));

    // Pointer nearby (or a recent tap) stirs it up: it pulses harder and climbs quicker,
    // then settles back to its calm drift. Wakes fast, calms slowly — like a startled animal.
    var near=0;
    if(now<ptr.until){
      var d=Math.hypot(ptr.x-(x+jf.w/2), ptr.y-(jf.y+jf.h*0.28)), R=78;
      if(d<R) near=1-d/R;
    }
    jf.act+=(near-jf.act)*(near>jf.act?0.16:0.015);

    // Swim stroke: a contraction that pushes it along, then a longer recovery while the bell
    // refills. The contrast is what keeps it alive rather than sliding, but it stays gentle.
    jf.pulseT+=dt/(jf.pulseDur/(1+jf.act*1.15)); if(jf.pulseT>1) jf.pulseT-=1;
    var p=jf.pulseT, contract=0.42, thrust, squash, sink=0;
    if(p<contract){                       // power stroke — bell squeezes and it gains on the drift
      var k=p/contract;
      thrust=Math.sin(k*Math.PI);
      squash=Math.sin(k*Math.PI);
    } else {                              // recovery — bell refills and it coasts to a stall
      var r=(p-contract)/(1-contract);
      thrust=0;
      squash=-0.35*Math.sin(r*Math.PI);   // slight over-relax, like a bell refilling
      sink=Math.sin(r*Math.PI)*0.85+0.15; // eases in, so it doesn't stall the instant the stroke ends
    }
    // Pulse-and-glide, the way a jellyfish actually travels — but most of the climb now rides on
    // the steady glide, with the contraction only nudging it along, so one stroke carries it
    // about half as far as it used to. Net speed is unchanged (jf.rise px/sec): the drag at peak
    // recovery exactly cancels the glide, so it hangs still for a beat instead of lurching.
    var glide= jf.rise*0.55;
    var up   = jf.rise*2.5*(1+jf.act*1.4)*thrust;
    var down = jf.rise*0.55*(1-jf.act*0.5)*sink;   // stirred up, it holds its coast better
    jf.y-=(glide+up-down)*dt;

    jf.el.style.transform='translate3d('+x.toFixed(1)+'px,'+jf.y.toFixed(1)+'px,0) rotate('+lean.toFixed(2)+'deg)';
    // Bell works harder when it's stirred up.
    var amp=1+jf.act*0.45;
    if(jf.bell) jf.bell.style.transform='scale('+(1+squash*0.10*amp).toFixed(3)+','+(1-squash*0.16*amp).toFixed(3)+')';
    // arms and tentacles lag the bell — they're dragged, not driven
    var lag=Math.sin((p-0.16)*Math.PI*2);
    if(jf.arms)  jf.arms.style.transform='scaleY('+(1+lag*0.07*amp).toFixed(3)+') skewX('+(sway*1.6).toFixed(2)+'deg)';
    if(jf.tents) jf.tents.style.transform='scaleY('+(1+lag*0.10*amp).toFixed(3)+') skewX('+(sway*2.6).toFixed(2)+'deg)';

    return jf.y >= -jf.h-10;              // false once it has cleared the top
  }

  function retire(slot,now){
    if(slot.d.el.parentNode) host.removeChild(slot.d.el);
    var k=live.indexOf(slot.d); if(k>=0) live.splice(k,1);
    slot.d=null;
    slot.at=now+1200+Math.random()*1800;  // a beat before this slot sends up the next one
  }

  function frame(now){
    if(!running){ raf=0; return; }
    if(!last) last=now;
    var dt=Math.min(0.05,(now-last)/1000); last=now;
    var W=window.innerWidth;
    // First frame sets the clock: stagger the slots so they don't rise as a matched pair.
    if(!seeded){ seeded=true; for(var i=0;i<slots.length;i++) slots[i].at=now+i*(2500+Math.random()*4500); }

    var next=Infinity;
    for(var s=0;s<slots.length;s++){
      var slot=slots[s];
      if(!slot.d){
        if(now>=slot.at) slot.d=spawn();
        else { if(slot.at<next) next=slot.at; continue; }
      }
      if(!step(slot.d,dt,now,W)){ retire(slot,now); if(slot.at<next) next=slot.at; }
    }

    // Nothing in the water and nothing due for a moment — let the browser idle until then
    // rather than burning frames on an empty layer.
    if(!live.length && next-now>250){
      raf=0;
      setTimeout(function(){ if(running&&!raf){ last=0; raf=requestAnimationFrame(frame); } }, next-now);
      return;
    }
    raf=requestAnimationFrame(frame);
  }

  function start(){ if(raf||!running) return; last=0; raf=requestAnimationFrame(frame); }
  document.addEventListener('visibilitychange',function(){
    running=!document.hidden;
    if(!running){ if(raf) cancelAnimationFrame(raf); raf=0; }
    else start();
  });
  // Narrowing the window must not strand an in-flight drifter off-screen — pull both ends of
  // every crossing back inside the new width.
  window.addEventListener('resize',function(){
    for(var i=0;i<live.length;i++){
      var d=live[i], m=d.w*0.6, hi=Math.max(m,window.innerWidth-m);
      d.x0=Math.min(hi,Math.max(m,d.x0));
      d.x1=Math.min(hi,Math.max(m,d.x1));
    }
  },{passive:true});
  start();
})();
</script>
</body>
