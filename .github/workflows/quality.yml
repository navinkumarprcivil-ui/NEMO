name: Website quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run regression tests
        run: npm test

      - name: Check Firebase rules coverage
        run: npm run check:rules

      - name: Build and validate Cloudflare package
        run: npm run cf:check

      - name: Confirm generated deployment files are committed
        run: git diff --exit-code -- app.js admin.js version.json sw.js cf-dist
