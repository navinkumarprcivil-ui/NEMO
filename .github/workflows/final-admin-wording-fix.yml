name: Verify admin security wording fix

on:
  push:
    branches:
      - agent/finalize-admin-release-v2
    paths:
      - .admin-wording-fix-trigger

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/finalize-admin-release-v2
          fetch-depth: 0
      - name: Correct wording and rebuild
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app.jsx'); s=p.read_text()
          old='🔒 Sign in with your configured Google admin account. Client-side admin passwords and recovery answers have been removed.'
          new='🔒 Sign in with the configured Google admin account to access protected Firebase data.'
          if old not in s: raise SystemExit('stale security wording not found')
          p.write_text(s.replace(old,new,1))
          PY
          node --test test/*.test.mjs
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          node scripts/build.mjs
          npm run build
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.jsx app.js version.json sw.js
          git commit -m "Align admin security wording [skip ci]"
          git push origin HEAD:agent/finalize-admin-release-v2
