name: Apply admin release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: admin-release-patch-main
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Correct current Settings anchors
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/apply-admin-release.py')
          s=p.read_text()
          s=s.replace("app.find('<Collapsible title=\"Admin Security\"')", "app.find('title=\"Admin Security\"')")
          s=s.replace("app.find('<Collapsible title=\"Data & Backup\"', sec_start)", "app.find('title=\"Data & Backup\"', sec_start)")
          p.write_text(s)
          PY
      - name: Apply requested release changes
        run: python3 scripts/apply-admin-release.py
      - name: Run complete test suite
        run: node --test test/*.test.mjs
      - name: Install build dependency
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Rebuild Cloudflare storefront
        run: npm run build
      - name: Restore one-time patcher source
        run: git checkout -- scripts/apply-admin-release.py
      - name: Commit verified release
        shell: bash
        run: |
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No release changes to commit"
          else
            git commit -m "Complete admin permissions release [skip ci]"
            git push origin HEAD:main
          fi
