name: Verify admin release

on:
  push:
    branches:
      - fix/admin-release-finalize
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: admin-release-finalize-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-release-finalize
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Correct release-script anchors
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/apply-admin-release.py')
          s=p.read_text()
          s=s.replace("app.find('<Collapsible title=\"Admin Security\"')", "app.find('title=\"Admin Security\"')")
          s=s.replace("app.find('<Collapsible title=\"Data & Backup\"', sec_start)", "app.find('title=\"Data & Backup\"', sec_start)")
          s=s.replace("r'const SPLASH_MAX_MS\\\\s*=\\\\s*12000'", "r'const SPLASH_MAX_MS\\s*=\\s*12000'")
          p.write_text(s)
          PY
      - name: Apply requested release changes
        run: python3 scripts/apply-admin-release.py
      - name: Install build dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Rebuild shipped app bundle
        run: node scripts/build.mjs
      - name: Run complete test suite
        run: node --test test/*.test.mjs
      - name: Build Cloudflare storefront
        run: npm run build
      - name: Check Cloudflare package
        run: npm run cf:check
      - name: Restore one-time patcher source
        run: git checkout -- scripts/apply-admin-release.py
      - name: Commit verified release
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app.jsx app.js index.html version.json sw.js database.rules.json test/ux-lifecycle.test.mjs test/admin-access-release.test.mjs
          if git diff --cached --quiet; then
            echo "No release changes to commit"
          else
            git commit -m "Complete admin permissions release [skip ci]"
            git push origin HEAD:fix/admin-release-finalize
          fi
