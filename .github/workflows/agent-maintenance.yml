name: Apply admin release

on:
  push:
    branches:
      - agent/finalize-admin-release
    paths-ignore:
      - .agent-release-status.txt

permissions:
  contents: write

concurrency:
  group: admin-release-patch-final
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/finalize-admin-release
          fetch-depth: 0

      - name: Apply, verify and build release
        id: release
        shell: bash
        run: |
          set +e
          : > .agent-release-status.txt
          echo "Admin release verification" >> .agent-release-status.txt
          echo "commit=$(git rev-parse HEAD)" >> .agent-release-status.txt

          node --test test/*.test.mjs > /tmp/baseline-tests.log 2>&1
          BASELINE=$?
          echo "baseline_tests_exit=$BASELINE" >> .agent-release-status.txt
          echo "baseline_failed_tests:" >> .agent-release-status.txt
          grep '^not ok' /tmp/baseline-tests.log >> .agent-release-status.txt || true

          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/apply-admin-release.py')
          s=p.read_text()
          s=s.replace(
              "app = replace_function(app, 'function AdminLogin(', 'function AdminHub(', admin_login, 'AdminLogin')",
              "app = replace_function(app, 'function AdminLogin(', '/* ═══════════════════ ADMIN SALES DASHBOARD', admin_login, 'AdminLogin')"
          )
          s=s.replace(
              "line_end = app.find('\\n', hub)",
              "tab_line = app.find('const [tab,setTab]=useState', hub)\nline_end = app.find('\\n', tab_line)"
          )
          s=s.replace(
              'sec_start = app.find(\'<Collapsible title="Admin Security"\')',
              'sec_title = app.find(\'title="Admin Security"\')\nsec_start = app.rfind(\'<Collapsible\', 0, sec_title) if sec_title >= 0 else -1'
          )
          s=s.replace(
              'next_card = app.find(\'<Collapsible title="Data & Backup"\', sec_start)',
              'next_title = app.find(\'title="Data & Backup"\', sec_start)\nnext_card = app.rfind(\'<Collapsible\', 0, next_title) if next_title >= 0 else -1'
          )
          s=s.replace(
              'assert.match(app,/mainAdminOk&&\\(<Collapsible title="Admin Security"/);',
              'assert.match(app,/mainAdminOk&&\\(<Collapsible[^>]*title="Admin Security"/);'
          )
          s=s.replace(
              'index, n = re.subn(r\'const SPLASH_MAX_MS\\s*=\\s*12000\', \'const SPLASH_MAX_MS = 4000\', index, count=1)',
              'index, n = re.subn(r\'(?:const|var) SPLASH_MAX_MS\\s*=\\s*12000\', \'var SPLASH_MAX_MS = 4000\', index, count=1)'
          )
          s=s.replace(
              '      await FB_DB.ref("settings").update(pub);',
              '      const safePub={...pub};\n      delete safePub.adminSetupHash; delete safePub.coAdminUid; delete safePub.coAdminPermissions;\n      await FB_DB.ref("settings").update(safePub);'
          )
          p.write_text(s)
          PY

          python3 scripts/apply-admin-release.py > /tmp/patch.log 2>&1
          PATCH=$?
          echo "patch_exit=$PATCH" >> .agent-release-status.txt
          cat /tmp/patch.log >> .agent-release-status.txt

          if [ "$PATCH" -eq 0 ]; then
            node --test test/*.test.mjs > /tmp/tests.log 2>&1
            TESTS=$?
          else
            TESTS=99
          fi
          echo "tests_exit=$TESTS" >> .agent-release-status.txt
          echo "patched_failed_tests:" >> .agent-release-status.txt
          if [ -f /tmp/tests.log ]; then grep '^not ok' /tmp/tests.log >> .agent-release-status.txt || true; fi

          if [ "$PATCH" -eq 0 ] && [ "$TESTS" -eq 0 ]; then
            if [ -f package-lock.json ]; then npm ci > /tmp/npm.log 2>&1; else npm install > /tmp/npm.log 2>&1; fi
            NPM=$?
          else
            NPM=99
          fi
          echo "npm_exit=$NPM" >> .agent-release-status.txt
          if [ "$NPM" -ne 0 ] && [ -f /tmp/npm.log ]; then tail -n 100 /tmp/npm.log >> .agent-release-status.txt; fi

          if [ "$NPM" -eq 0 ]; then
            node scripts/build.mjs > /tmp/compile.log 2>&1
            COMPILE=$?
          else
            COMPILE=99
          fi
          echo "compile_exit=$COMPILE" >> .agent-release-status.txt
          if [ -f /tmp/compile.log ]; then cat /tmp/compile.log >> .agent-release-status.txt; fi

          if [ "$COMPILE" -eq 0 ]; then
            npm run build > /tmp/cf.log 2>&1
            CF=$?
          else
            CF=99
          fi
          echo "cloudflare_build_exit=$CF" >> .agent-release-status.txt
          if [ -f /tmp/cf.log ]; then cat /tmp/cf.log >> .agent-release-status.txt; fi

          if [ "$PATCH" -eq 0 ] && [ "$TESTS" -eq 0 ] && [ "$NPM" -eq 0 ] && [ "$COMPILE" -eq 0 ] && [ "$CF" -eq 0 ]; then
            echo "RESULT=PASS" >> .agent-release-status.txt
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "RESULT=FAIL" >> .agent-release-status.txt
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
          git checkout -- scripts/apply-admin-release.py
          exit 0

      - name: Commit verified product release
        if: steps.release.outputs.ok == 'true'
        shell: bash
        run: |
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app.jsx app.js database.rules.json index.html version.json sw.js test/ux-lifecycle.test.mjs test/admin-access-release.test.mjs
          git commit -m "Complete admin permissions release [skip ci]"
          git push origin HEAD:agent/finalize-admin-release

      - name: Commit verification report on failure
        if: steps.release.outputs.ok != 'true'
        shell: bash
        run: |
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .agent-release-status.txt
          git commit -m "Record admin release verification failure [skip ci]" || true
          git push origin HEAD:agent/finalize-admin-release
