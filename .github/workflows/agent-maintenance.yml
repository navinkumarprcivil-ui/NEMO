name: Verify admin release

on:
  push:
    branches:
      - fix/admin-release-finalize
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: admin-release-finalize-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-release-finalize
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Correct release-script anchors
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/apply-admin-release.py')
          s=p.read_text()
          lines=s.splitlines()
          out=[]
          fixed_splash=False
          for line in lines:
              if 'sec_start = app.find(' in line and 'Admin Security' in line:
                  out.append("sec_title = app.find('title=\"Admin Security\"')")
                  out.append("sec_start = app.rfind('<Collapsible', 0, sec_title)")
              elif 'next_card = app.find(' in line and 'Data & Backup' in line:
                  out.append("next_title = app.find('title=\"Data & Backup\"', sec_start)")
                  out.append("next_card = app.rfind('<Collapsible', sec_start, next_title)")
              elif 'index, n = re.subn' in line and 'SPLASH_MAX_MS' in line:
                  out.append("index, n = re.subn(r'(?:var|const)\\s+SPLASH_MAX_MS\\s*=\\s*12000', 'var SPLASH_MAX_MS = 4000', index, count=1)")
                  fixed_splash=True
              elif 'assert.match(app,/mainAdminOk' in line and 'Admin Security' in line:
                  out.append("  assert.match(app,/mainAdminOk&&\\(<Collapsible[^>]*title=\"Admin Security\"/);")
              else:
                  out.append(line)
          if not fixed_splash:
              raise SystemExit('release splash matcher line not found')
          p.write_text('\n'.join(out)+'\n')
          PY
      - name: Apply requested release changes
        run: python3 scripts/apply-admin-release.py
      - name: Install build dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Rebuild shipped app bundle
        run: node scripts/build.mjs
      - name: Run complete test suite
        run: node --test test/*.test.mjs
      - name: Build Cloudflare storefront
        run: npm run build
      - name: Check Cloudflare package
        run: npm run cf:check
      - name: Restore one-time patcher source
        run: git checkout -- scripts/apply-admin-release.py
      - name: Commit verified release
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app.jsx app.js index.html version.json sw.js database.rules.json test/ux-lifecycle.test.mjs test/admin-access-release.test.mjs
          if git diff --cached --quiet; then
            echo "No release changes to commit"
          else
            git commit -m "Complete admin permissions release [skip ci]"
            git push origin HEAD:fix/admin-release-finalize
          fi
