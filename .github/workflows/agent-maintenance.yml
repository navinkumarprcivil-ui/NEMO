name: Agent maintenance

on:
  push:
    branches:
      - agent/admin-permissions-release
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact release blocks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          lines=Path('app.jsx').read_text(errors='replace').splitlines()
          def safe(s):
            s=re.sub(r'([A-Za-z0-9_]*(?:Pass|pass|Hash|hash|Secret|secret)[A-Za-z0-9_]*\s*[:=]\s*)["\'][^"\']+["\']',r'\1"<redacted>"',s)
            return s
          for name,a,b in [
            ('offer-banners',5260,5345),('customer-orders',6588,6690),('why-popup',11225,11290),
            ('admin-login',11370,11475),('admin-hub-start',13305,13490),('admin-security',14790,14955),
            ('settings-save',16430,16455),('settings-load',16535,16675),('admin-signin',17052,17082),
            ('wallet-boot',17945,17990),('app-render',17995,18038)
          ]:
            print(f'\n===== {name} {a}:{b} =====')
            for n in range(a-1,min(len(lines),b)):
              print(f'{n+1:05d}: {safe(lines[n])}')
          print('\n===== rules =====')
          for n,l in enumerate(Path('database.rules.json').read_text(errors='replace').splitlines(),1): print(f'{n:04d}: {l}')
          PY
      - name: Baseline tests
        run: node --test test/*.test.mjs
