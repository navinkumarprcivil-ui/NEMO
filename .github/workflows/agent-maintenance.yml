name: Apply admin release

on:
  push:
    branches:
      - agent/admin-permissions-release

permissions:
  contents: write

concurrency:
  group: admin-release-patch
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/admin-permissions-release
          fetch-depth: 0
      - name: Apply requested release changes
        run: python3 scripts/apply-admin-release.py
      - name: Run complete test suite
        run: node --test test/*.test.mjs
      - name: Install build dependency
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Rebuild Cloudflare storefront
        run: npm run build
      - name: Commit verified release
        shell: bash
        run: |
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No release changes to commit"
          else
            git commit -m "Complete admin permissions release [skip ci]"
            git push origin HEAD:agent/admin-permissions-release
          fi
