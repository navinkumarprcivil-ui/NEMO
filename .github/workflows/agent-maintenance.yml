name: Agent maintenance

on:
  push:
    branches:
      - agent/admin-permissions-release
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect persistence before release patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('app.jsx').read_text(errors='replace').splitlines()
          for term in ['async function saveSettings','function saveSettings','function OfferBanners','function OrderHistoryPage']:
            hits=[i for i,l in enumerate(lines) if term.lower() in l.lower()]
            print(f'\n## {term}: {[i+1 for i in hits]}')
            for i in hits[:3]:
              for n in range(max(0,i-5),min(len(lines),i+90)): print(f'{n+1:05d}: {lines[n]}')
              print('---')
          PY
      - name: Baseline tests
        run: node --test test/*.test.mjs
