name: Verify password-every-entry admin flow

on:
  push:
    branches:
      - agent/admin-password-every-entry

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/admin-password-every-entry
          fetch-depth: 0

      - name: Patch admin password and UID behavior
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('app.jsx')
          s=p.read_text()
          original=s

          # Password must be requested every time Admin is opened: remove remembered unlock.
          s,n=re.subn(
              r'\n\s*useEffect\(\(\)=>\{\s*try\{\s*if\(sessionStorage\.getItem\("nemo-admin-unlocked-v1"\)==="1"\)\s*onSuccess\(\);\s*\}catch\(e\)\{\}\s*\},\[\]\);',
              '', s, count=1
          )
          if n!=1:
              raise SystemExit(f'expected one remembered-unlock effect, found {n}')

          remembered='try{ sessionStorage.setItem("nemo-admin-unlocked-v1","1"); }catch(e){}'
          count=s.count(remembered)
          if count!=2:
              raise SystemExit(f'expected two remembered-unlock writes, found {count}')
          s=s.replace(remembered,'')

          old_copy='The password unlocks the Admin workspace. Google sign-in is still required inside Admin before Firebase orders or changes can be accessed.'
          new_copy='Enter the Admin password every time you open Admin. Google sign-in is needed only for shared Firebase data and changes; only the main admin or the added co-admin UID can sync changes.'
          if old_copy not in s:
              raise SystemExit('AdminLogin explanatory copy not found')
          s=s.replace(old_copy,new_copy,1)

          # Password controls entry to the Admin UI. Firebase UID controls shared cloud authority.
          needle='function canAdminSection(section,uid=(FB_AUTH&&FB_AUTH.currentUser&&FB_AUTH.currentUser.uid)||""){\n  if(isMainAdminUid(uid)) return true;\n  return isCoAdminUid(uid)&&RUNTIME_ADMIN_ACCESS.permissions&&RUNTIME_ADMIN_ACCESS.permissions[section]===true;\n}'
          insert=needle+'\nfunction canViewAdminSection(section,uid=(FB_AUTH&&FB_AUTH.currentUser&&FB_AUTH.currentUser.uid)||""){\n  // Password controls Admin workspace entry. Only a configured co-admin is UI-limited\n  // by section permissions; an unconfigured UID may inspect the workspace/copy its UID,\n  // but Firebase rules still reject shared writes from that UID.\n  return isCoAdminUid(uid)?canAdminSection(section,uid):true;\n}'
          if needle not in s:
              raise SystemExit('canAdminSection anchor not found')
          s=s.replace(needle,insert,1)

          old_allowed='const allowedTabs=ADMIN_SECTION_KEYS.filter(k=>canAdminSection(k,adminUid));'
          new_allowed='const allowedTabs=isCoAdminUid(adminUid)?ADMIN_SECTION_KEYS.filter(k=>canAdminSection(k,adminUid)):ADMIN_SECTION_KEYS;'
          if old_allowed not in s:
              raise SystemExit('allowedTabs anchor not found')
          s=s.replace(old_allowed,new_allowed,1)

          old_effect='if(ADMIN_SECTION_KEYS.includes(tab)&&!canAdminSection(tab,adminUid)&&allowedTabs.length) setTab(allowedTabs[0]);'
          new_effect='if(isCoAdminUid(adminUid)&&ADMIN_SECTION_KEYS.includes(tab)&&!canAdminSection(tab,adminUid)&&allowedTabs.length) setTab(allowedTabs[0]);'
          if old_effect not in s:
              raise SystemExit('AdminHub permission redirect anchor not found')
          s=s.replace(old_effect,new_effect,1)

          hub=s.find('function AdminHub(')
          panel=s.find('function SettingsPanel(',hub)
          if hub<0 or panel<0:
              raise SystemExit('AdminHub/SettingsPanel boundaries missing')
          before=s[:hub]
          segment=s[hub:panel]
          after=s[panel:]
          for key in ['dashboard','orders','products','requests','guides','wallets','settings','reviews']:
              old=f'canAdminSection("{key}",adminUid)'
              new=f'canViewAdminSection("{key}",adminUid)'
              if old not in segment:
                  raise SystemExit(f'AdminHub render guard missing for {key}')
              segment=segment.replace(old,new)
          s=before+segment+after

          if s==original:
              raise SystemExit('patch made no changes')
          if 'sessionStorage.getItem("nemo-admin-unlocked-v1")' in s or 'sessionStorage.setItem("nemo-admin-unlocked-v1"' in s:
              raise SystemExit('remembered Admin unlock still present')
          p.write_text(s)
          PY

          cat > test/admin-password-every-entry.test.mjs <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';

          const app=fs.readFileSync('app.jsx','utf8');
          const rules=JSON.parse(fs.readFileSync('database.rules.json','utf8')).rules;
          const login=app.slice(app.indexOf('function AdminLogin('),app.indexOf('function MediaUploader('));
          const hub=app.slice(app.indexOf('function AdminHub('),app.indexOf('function SettingsPanel('));

          test('Admin password is required on every entry and is never remembered',()=>{
            assert.match(login,/placeholder="Admin password"/);
            assert.match(login,/adminPasswordDigest\(password\)/);
            assert.doesNotMatch(login,/nemo-admin-unlocked-v1/);
            assert.doesNotMatch(login,/sessionStorage/);
            assert.match(login,/Enter the Admin password every time you open Admin/);
          });

          test('password opens Admin UI while configured co-admin permissions still limit its tabs',()=>{
            assert.match(app,/function canViewAdminSection\(/);
            assert.match(hub,/const allowedTabs=isCoAdminUid\(adminUid\)\?ADMIN_SECTION_KEYS\.filter\(k=>canAdminSection\(k,adminUid\)\):ADMIN_SECTION_KEYS;/);
            assert.match(hub,/if\(isCoAdminUid\(adminUid\)&&ADMIN_SECTION_KEYS\.includes\(tab\)/);
            for(const key of ['orders','dashboard','products','wallets','reviews','requests','guides','settings']){
              assert.match(hub,new RegExp(`canViewAdminSection\\("${key}",adminUid\\)`));
            }
          });

          test('unapproved Firebase UIDs still cannot write shared adminAccess or protected product data',()=>{
            assert.match(rules.adminAccess['.write'],/auth\.uid === 'cI2HmMt6FdR7fO7uUnugH85GeZt2'/);
            assert.match(rules.products['.write'],/adminAccess\/coAdminUid/);
            assert.match(rules.products['.write'],/permissions\/products/);
          });
          EOF

      - name: Run full tests
        run: node --test test/*.test.mjs

      - name: Install build dependency
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Compile shipped app
        run: node scripts/build.mjs

      - name: Build Cloudflare package
        run: npm run build

      - name: Commit verified change and remove verifier
        shell: bash
        run: |
          rm -f .github/workflows/admin-password-every-entry.yml
          if ! git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then rm -f package-lock.json; fi
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Require Admin password on every entry"
          git push origin HEAD:agent/admin-password-every-entry
