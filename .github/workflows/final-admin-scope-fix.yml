name: Verify admin review scope fix

on:
  push:
    branches:
      - agent/finalize-admin-release-v2
    paths:
      - .admin-scope-fix-trigger

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/finalize-admin-release-v2
          fetch-depth: 0
      - name: Correct scope and verify
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app.jsx')
          s=p.read_text()
          hub=s.find('function AdminHub(')
          settings=s.find('function SettingsPanel(',hub)
          if hub<0 or settings<0: raise SystemExit('AdminHub bounds missing')
          before=s[:hub]
          before,n=re.subn(r'\{tab==="reviews"\s*&&\s*canAdminSection\("reviews",adminUid\)\s*&&\s*\(', '{tab==="reviews"&&(', before, count=1)
          if n!=1: raise SystemExit('customer reviews guard not found')
          block=s[hub:settings]
          block,n=re.subn(r'\{tab==="reviews"\s*&&\s*\(', '{tab==="reviews"&&canAdminSection("reviews",adminUid)&&(', block, count=1)
          if n!=1: raise SystemExit('admin reviews tab anchor not found')
          s=before+block+s[settings:]
          s=s.replace('Google-only admin access','Firebase admin identity',1)
          p.write_text(s)
          PY

          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('app.jsx').read_text()
          detail=s[s.find('function DetailPage('):s.find('function AdminLogin(')]
          hub=s[s.find('function AdminHub('):s.find('function SettingsPanel(')]
          if 'canAdminSection("reviews",adminUid)' in detail: raise SystemExit('admin review guard leaked into customer UI')
          for key in ['orders','dashboard','products','wallets','reviews','requests','guides','settings']:
            if not re.search(r'\{tab==="'+re.escape(key)+r'"\s*&&\s*canAdminSection\("'+re.escape(key)+r'",adminUid\)\s*&&\s*\(',hub):
              raise SystemExit('missing AdminHub guard: '+key)
          if 'Firebase admin identity' not in s: raise SystemExit('security wording not updated')
          print('scope invariants pass')
          PY

          node --test test/*.test.mjs
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          node scripts/build.mjs
          npm run build

          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.jsx app.js version.json sw.js
          git commit -m "Fix admin review permission scope [skip ci]"
          git push origin HEAD:agent/finalize-admin-release-v2
