      .then(function(r){ return r?r.text():null; }).catch(function(){ return null; });
  }
  function cachePut(key,code){
    if(!window.caches) return;
    try{ caches.open("nemo-compiled").then(function(c){ c.put(key, new Response(code,{headers:{"Content-Type":"application/javascript"}})); }).catch(function(){}); }catch(e){}
  }
  function compileWithBabel(src,key){
    var b=document.createElement("script");
    b.src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js";
    b.crossOrigin="anonymous";
    b.onload=function(){
      try{
        var code=Babel.transform(src,{presets:["react"]}).code; // JSX only — output is modern JS, no runtime deps
        cachePut(key,code);
        run(code);
      }catch(e){ console.error("compile failed",e); }
    };
    b.onerror=function(){ console.error("Babel failed to load"); };
    document.head.appendChild(b);
  }
  function hash(s){ var h=5381,i=s.length; while(i){ h=(h*33)^s.charCodeAt(--i); } return (h>>>0).toString(36); }
  fetch("app.jsx").then(function(r){return r.text();}).then(function(src){
    var key="/__nemo_compiled__/"+hash(src);
    cacheGet(key).then(function(cached){
      if(cached){
        run(cached);
        // Safety net: if the cached build somehow didn't define the app, recompile fresh.
        setTimeout(function(){ if(typeof NemoStore==="undefined"){ compileWithBabel(src,key); } }, 500);
      } else {
        compileWithBabel(src,key);
      }
    });
  }).catch(function(e){ console.error("Could not load app.jsx",e); });
})();
</script>

      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
