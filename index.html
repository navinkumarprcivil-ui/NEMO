<!-- Preload logo so it appears instantly when React mounts. The WebP is 19 KB
     against the PNG's 160 KB, which on a first visit over 3G is most of a
     second on the highest-priority image on the page. `type` keeps a browser
     that cannot read WebP from preloading something it will not use; the PNG is
     still there, first in the fallback chain below, and is still what the
     structured data, the manifest and share cards point at. -->
<link rel="preload" as="image" href="assets/nemo-logo.webp" type="image/webp" fetchpriority="high"/>
<script>
  /* Ordered fallbacks for the splash logo; each onerror advances one step. */
  (function(){
    var step=0;
    /* The PNG leads: the splash asks for the WebP, so the first step is the
       one that answers "this browser has no WebP" as well as "that file is
       missing". After that, past the cache, then the app icon. */
    var tries=["assets/nemo-logo.png","assets/nemo-logo.png?retry=1","assets/favicon-192.png"];
    window.__nemoLogoFallback=function(img){
      if(step<tries.length){ img.src=tries[step++]; return; }
      img.style.display="none";
      var fb=img.parentNode&&img.parentNode.querySelector(".emoji-fallback");
      if(fb) fb.style.display="block";
    };
  })();
</script>
<!-- Preload the precompiled bundle so it's ready the moment the page is interactive.
     `crossorigin` on its own means "anonymous", whose credentials mode is
     same-origin — which is exactly what the plain fetch("app.js") below uses,
     so the preload is reused. A preload is only reused when its credentials
     mode matches the request that follows it, and a mismatch is silent: the
     browser just downloads the whole 850 KB bundle a second time. Dropping this
     attribute, or passing credentials to that fetch, does it. Don't touch one
     without the other — scripts/check-firstpaint.mjs counts the downloads. -->
<link rel="preload" href="app.js" as="fetch" crossorigin/>

<!-- Fonts: load async (media=print trick), so they never block first paint of the splash.
     The splash then WAITS for the faces before it lifts (see the fontsReady gate in app.jsx).
     A webfont that swaps in after the store is already visible re-renders every line of text
     on the page at once, and on a cold load that is the most visible flicker a shopper gets.
     The wait is bounded there, so a font that never arrives cannot hold the store. -->
<script>
  window.__nemoFontsReady = false;
  window.nemoFontsDone = function(){
    if (window.__nemoFontsReady) return;
    window.__nemoFontsReady = true;
    try { window.dispatchEvent(new Event("nemo-fonts-ready")); } catch(e) {}
  };
  window.nemoFontCssLoaded = function(link){
    try { link.media = "all"; } catch(e) {}
    var f = document.fonts;
    /* No Font Loading API (or the stylesheet failed): nothing to wait for, so do not make
       anyone wait. The page still renders, in the fallback stack. */
    if (!f || !f.load) { window.nemoFontsDone(); return; }
    /* Named faces, not the `fonts.ready` promise, which resolves as soon as nothing is pending —
       and at this instant nothing is, because the @font-face rules have only just become
       active. Asking for the two weights above the fold is what makes this wait for the font
       FILES rather than for the CSS that mentions them. */
    Promise.all([f.load("400 1rem 'Plus Jakarta Sans'"), f.load("800 1rem 'Plus Jakarta Sans'")])
      .then(window.nemoFontsDone, window.nemoFontsDone);
  };
</script>
<link rel="stylesheet" media="print" onload="nemoFontCssLoaded(this)" onerror="nemoFontsDone()" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"/>
<style>
  html,body,#root{height:100%;margin:0;padding:0;background:#ffffff;}

  #splash .b1{left:12%;width:14px;height:14px;animation-duration:5.5s;}
  #splash .b2{left:26%;width:8px;height:8px;animation-duration:4.2s;animation-delay:.8s;}
  #splash .b3{left:44%;width:18px;height:18px;animation-duration:6.5s;animation-delay:.3s;}

  #splash .logo::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.35) 50%,transparent 62%);

  /* A determinate bar, not a spinner. An indeterminate ring says only "still working"; on a
     slow connection that is indistinguishable from a hang, which is when people leave. The
     percentage is driven by real boot milestones reported from the app (see nemoSplashProgress
     below), with a slow creep in between so it is never frozen while the network is quiet. */
  #splash .prog{width:min(210px,58vw);margin-top:14px;opacity:0;animation:fadeIn .5s ease 1.1s both;}

     Cache key is a hash of app.jsx, so any code change auto-recompiles. Cache API is used (not
     localStorage) because the app already uses localStorage for image caching. -->
<script>
(function(){
  // There is deliberately no display-duration timer. The cinematic opening remains only
  // while NemoStore completes its initial catalogue, settings, community and wallet reads,

    ctx.quadraticCurveTo(w*0.11,Rh*0.22, 0,0);
    ctx.closePath();
    ctx.fillStyle='#eec089'; ctx.fill();
    ctx.strokeStyle=brown+'.85)'; ctx.lineWidth=line; ctx.stroke();
    ctx.restore();

    // ── face. The eye opens from a small dark bead into a wide startled one, the blush comes
    //    up, and the smile gives way to a small round "oh" — all cross-faded on q so there is
    //    no frame where it swaps.
    var ex=-L*0.44, ey=-Rh*0.16;
    var e=Math.max(0,Math.min(1,(q-0.32)/0.42));   // how far into "startled" the face is
    if(e>0.02){                                    // white of the eye, only once it is wide
      ctx.beginPath(); ctx.ellipse(ex,ey,w*0.088*e+w*0.052,w*0.10*e+w*0.052,0,0,Math.PI*2);
      ctx.fillStyle='rgba(255,255,255,'+e+')'; ctx.fill();
      ctx.strokeStyle=brown+(0.7*e)+')'; ctx.lineWidth=line*0.8; ctx.stroke();
    }
    ctx.beginPath();
    ctx.arc(ex, ey-w*0.022*e, w*(0.050-0.012*e), 0, Math.PI*2);   // pupil rides up when startled
    ctx.fillStyle='#3a2a1c'; ctx.fill();
    ctx.beginPath(); ctx.arc(ex-w*0.016, ey-w*0.038*e-w*0.012, w*0.017, 0, Math.PI*2);
    ctx.fillStyle='#fff'; ctx.fill();
    // blush
    ctx.beginPath(); ctx.ellipse(ex-w*0.045, ey+w*0.10, w*0.062, w*0.036, 0, 0, Math.PI*2);
    ctx.fillStyle='rgba(238,150,140,'+(0.30+0.45*q)+')'; ctx.fill();
    // mouth
    if(e<0.98){
      ctx.beginPath();
      ctx.moveTo(-L*0.80, Rh*0.16);
      ctx.quadraticCurveTo(-L*0.70, Rh*0.30, -L*0.58, Rh*0.16);
      ctx.strokeStyle=brown+(0.9*(1-e))+')'; ctx.lineWidth=line; ctx.stroke();
    }
    if(e>0.02){
      ctx.beginPath(); ctx.ellipse(-L*0.70, Rh*0.22, w*0.036*e, w*0.048*e, 0, 0, Math.PI*2);
      ctx.fillStyle='rgba(214,117,107,'+e+')'; ctx.fill();
      ctx.strokeStyle=brown+(0.8*e)+')'; ctx.lineWidth=line*0.7; ctx.stroke();
    }
    ctx.restore(); ctx.globalAlpha=1;
  }

  /* One puffer, and the four things it can be doing. `q` is the inflation the drawing reads;
     `state` is what it is up to. Entry sides are chosen at spawn so a replacement arrives from
     wherever there is room, rather than always rising from the same corner. */
  function mkPuffer(w){
    var side=['bottom','left','right'][Math.floor(Math.random()*3)];
    var x,y;
    if(side==='left'){ x=-w; y=H*0.2+Math.random()*H*0.5; }
    else if(side==='right'){ x=W+w; y=H*0.2+Math.random()*H*0.5; }
    else { x=W*0.2+Math.random()*W*0.6; y=H+w; }
    return {w:w, x:x, y:y, vx:0, vy:0,
      tx:40+Math.random()*Math.max(1,W-80), ty:H*0.18+Math.random()*Math.max(1,H*0.56),
      phase:Math.random()*Math.PI*2, wag:0, alpha:0.92,
      state:'calm', q:0, at:0, dir:-1};
  }
  function stepPuffer(pf,now){
    pf.phase+=0.025; pf.wag+=0.05;
    if(pf.state==='calm'){
      // Same wander as the clownfish: pick a spot, drift to it, pick another.
      var ax=pf.tx-pf.x, ay=pf.ty-pf.y, ad=Math.hypot(ax,ay);
      if(ad<50){ pf.tx=40+Math.random()*Math.max(1,W-80); pf.ty=H*0.12+Math.random()*Math.max(1,H*0.68); }
      else { pf.vx+=(ax/ad)*0.005; pf.vy+=(ay/ad)*0.005; }
      var m=34;
      if(pf.x<m) pf.vx+=0.02; else if(pf.x>W-m) pf.vx-=0.02;
      if(pf.y<m) pf.vy+=0.02; else if(pf.y>H-m) pf.vy-=0.02;
      var sp=Math.hypot(pf.vx,pf.vy), MX=0.38;
      if(sp>MX){ pf.vx*=MX/sp; pf.vy*=MX/sp; }
      pf.vx*=0.99; pf.vy*=0.99;
      pf.x+=pf.vx; pf.y+=pf.vy+Math.sin(pf.phase)*0.10;
      if(Math.abs(pf.vx)>0.02) pf.dir=pf.vx>0?-1:1;
      pf.q+=(0-pf.q)*0.08;
    } else if(pf.state==='puff'){
      // Inflating. It stops swimming and just swells, with a little overshoot at the top.
      pf.vx*=0.90; pf.vy*=0.90;
      pf.x+=pf.vx; pf.y+=pf.vy;
      pf.q+=(1.06-pf.q)*0.085;
      if(pf.q>1.0){ pf.q=1; pf.state='hold'; pf.at=now+700; }
    } else if(pf.state==='hold'){
      pf.y+=Math.sin(pf.phase*1.6)*0.16;      // bobs while it decides it is buoyant
      if(now>=pf.at){ pf.state='rise'; }
    } else if(pf.state==='rise'){
      // A ball of air goes up. Slowly, and rocking, because it has no say in the matter.
      pf.vy+=(-0.62-pf.vy)*0.02;
      pf.vx+=(Math.sin(pf.phase*0.7)*0.12-pf.vx)*0.03;
      pf.x+=pf.vx; pf.y+=pf.vy;
      if(pf.y < -pf.w*1.6){ pf.state='gone'; pf.at=now+1500; }
    } else if(pf.state==='gone'){
      if(now>=pf.at){ var nx=mkPuffer(pf.w); for(var k in nx) pf[k]=nx[k]; }
    }
  }
  // A tap anywhere on it sets it off. Like popAt, this reads the same pointer position the
  // wallpaper already tracks — the canvas is pointer-events:none and must never eat a tap.
  function puffAt(px,py){
    if(!puffer||puffer.state!=='calm') return false;
    var L=puffer.w*0.5, Rh=puffer.w*0.30;
    if(Math.hypot(px-puffer.x,py-puffer.y) > Math.max(L,Rh)+20) return false;
    puffer.state='puff';
    return true;
  }
  // ── snails that crawl along the bottom and the side walls, and hide when touched ──
  function mkSnail(wall){
    var s=13+Math.random()*7;
    return {wall:wall, t:Math.random(), dir:Math.random()<0.5?1:-1,
      v:(0.055+Math.random()*0.035), s:s, phase:Math.random()*Math.PI*2,
      state:'crawl', eyeOut:1, hideUntil:0, alpha:0.5+Math.random()*0.25};
  }
  function seed(){
    var count=Math.round(Math.min(30,Math.max(12,(W*H)/46000)));
    bubbles=[]; for(var i=0;i<count;i++) bubbles.push(mk(Math.random()*H));
    /* The fish are on every screen now. They were desktop-only at >=1000px, and
       that was always a bytes decision rather than a design one: at 313 KB of
       base64 inside index.html every phone paid for them whether or not it drew
       them, so the cheapest answer was to draw them only where the weight
       mattered least. They are 37 KB of lazily fetched WebP, so there is nothing
       left to ration — and the aquarium is the point of the storefront. They
       scale down with the viewport so two fish on a 390px screen read as
       background rather than as an obstruction. */
    var fw=window.innerWidth<560?Math.max(44,Math.round(window.innerWidth*0.14)):78;
    loadFish();
    fish=[mkFish(bettaImg,false,fw), mkFish(clownImg,true,Math.round(fw*0.92))];
    /* Kept across a resize when there is one, so a rotated phone does not deflate a puffer
       mid-puff or reset one that is on its way up. Only its size follows the new viewport. */
    if(puffer){ puffer.w=Math.round(fw*0.86); }
    else { puffer=mkPuffer(Math.round(fw*0.86)); }
    snails=[mkSnail('bottom'), mkSnail('left'), mkSnail('right')];
  }
  function resize(){
    W=window.innerWidth; H=window.innerHeight;
    canvas.width=Math.floor(W*DPR); canvas.height=Math.floor(H*DPR);
    canvas.style.width=W+'px'; canvas.style.height=H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0); seed();
  }
  function bg(){
    var g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#eef8fd'); g.addColorStop(0.55,'#f7fbfe'); g.addColorStop(1,'#ffffff');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  }
  function drawBubble(x,y,r,a){
    var rg=ctx.createRadialGradient(x-r*0.3,y-r*0.3,r*0.1,x,y,r);
    rg.addColorStop(0,'rgba(220,244,251,'+(a*0.95)+')');
    rg.addColorStop(0.55,'rgba(74,187,220,'+(a*0.8)+')');
    rg.addColorStop(1,'rgba(20,150,190,0)');
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fillStyle=rg; ctx.fill();
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.strokeStyle='rgba(52,168,202,'+(a*0.85)+')'; ctx.lineWidth=1.3; ctx.stroke();
    ctx.beginPath(); ctx.arc(x-r*0.32,y-r*0.34,Math.max(1,r*0.14),0,Math.PI*2); ctx.fillStyle='rgba(255,255,255,'+(a*1.1)+')'; ctx.fill();
  }
  // A fish image, drawn in vertical slices so the tail/fins undulate gently. (image faces left)
  function drawFish(img,x,y,w,dir,tilt,a,wag){
    if(!img.complete||!img.naturalWidth) return;
    var nw=img.naturalWidth, nh=img.naturalHeight, h=w*(nh/nw);
    ctx.save(); ctx.translate(x,y); ctx.rotate(tilt*dir); ctx.scale(dir,1); ctx.globalAlpha=a;
    var N=14, amp=h*0.05;
    for(var i=0;i<N;i++){
      var sx=(nw/N)*i, sw=nw/N+0.6;
      var dx=-w/2+(w/N)*i, dw=w/N+0.6;
      // tail (right of source) sways most; head (left) barely moves
      var f=i/(N-1);
      var off=Math.sin(wag - f*2.4)*amp*f*f;
      ctx.drawImage(img, sx,0,sw,nh, dx,-h/2+off,dw,h);
    }
    ctx.restore(); ctx.globalAlpha=1;
  }
  // Snail: coiled shell + a soft foot. eyeOut (0..1) extends/retracts the eye-stalks. rot clings to walls.
  function drawSnail(x,y,s,dir,a,rot,eyeOut){
    var eo=(eyeOut==null?1:eyeOut);
    ctx.save(); ctx.translate(x,y); ctx.rotate(rot||0); ctx.scale(dir,1); ctx.globalAlpha=a;
    // foot
    ctx.beginPath(); ctx.moveTo(-s*0.9,s*0.32);
    ctx.quadraticCurveTo(-s*1.1,-s*0.05,-s*0.4,-s*0.05);
    ctx.lineTo(s*0.85,-s*0.05);
    ctx.quadraticCurveTo(s*1.05,s*0.05,s*0.75,s*0.32);
    ctx.closePath(); ctx.fillStyle='rgba(150,110,90,0.9)'; ctx.fill();
    // eye stalks — only when extended
    if(eo>0.06){
      var e1x=s*0.7+s*0.25*eo, e1y=-s*0.02-s*0.48*eo;
      var e2x=s*0.5+s*0.12*eo, e2y=-s*0.02-s*0.48*eo;
      ctx.strokeStyle='rgba(150,110,90,0.9)'; ctx.lineWidth=Math.max(1,s*0.09); ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(s*0.7,-s*0.02); ctx.lineTo(e1x,e1y); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(s*0.5,-s*0.02); ctx.lineTo(e2x,e2y); ctx.stroke();
      ctx.beginPath(); ctx.arc(e1x,e1y-s*0.05,Math.max(1,s*0.08),0,Math.PI*2);
      ctx.arc(e2x,e2y-s*0.05,Math.max(1,s*0.08),0,Math.PI*2); ctx.fillStyle='#12303a'; ctx.fill();
    }
    // shell
    var sh=ctx.createRadialGradient(-s*0.15,-s*0.35,s*0.1,0,-s*0.15,s*0.95);
    sh.addColorStop(0,'rgba(255,206,120,1)'); sh.addColorStop(1,'rgba(214,140,52,1)');
    ctx.beginPath(); ctx.arc(0,-s*0.15,s*0.8,0,Math.PI*2); ctx.fillStyle=sh; ctx.fill();
    // spiral
    ctx.strokeStyle='rgba(150,90,30,0.8)'; ctx.lineWidth=Math.max(1,s*0.1);
    ctx.beginPath(); ctx.arc(0,-s*0.15,s*0.5,0,Math.PI*1.6); ctx.stroke();
    ctx.beginPath(); ctx.arc(s*0.08,-s*0.05,s*0.22,0,Math.PI*2); ctx.stroke();
    ctx.restore(); ctx.globalAlpha=1;
  }
  function nudge(o,px,py,R,strength){
    if(!mouse.active) return;
    var dx=(px+o.ox)-mouse.x, dy=(py+o.oy)-mouse.y, d=Math.hypot(dx,dy);
    if(d<R&&d>0.01){ var f=(1-d/R)*strength; o.ox+=(dx/d)*f; o.oy+=(dy/d)*f; }
    o.ox*=0.90; o.oy*=0.90;
  }
  function loop(){
    if(!running){ looping=false; return; }
    ctx.clearRect(0,0,W,H); bg();
    for(var i=0;i<bubbles.length;i++){
      var b=bubbles[i];
      b.phase+=0.006*b.sway; b.y+=b.vy;
      var sx=b.x+Math.sin(b.phase)*b.swayA;
      if(mouse.active){
        var dx=(sx+b.ox)-mouse.x, dy=(b.y+b.oy)-mouse.y, d=Math.hypot(dx,dy), R=130;
        if(d<R&&d>0.01){ var f=(1-d/R)*4; b.ox+=(dx/d)*f; b.oy+=(dy/d)*f; }
      }
      b.ox*=0.90; b.oy*=0.90;
      if(b.y+b.r<-20){ Object.assign(b,mk()); b.y=H+b.r+Math.random()*40; }
      drawBubble(sx+b.ox,b.y+b.oy,b.r,b.alpha);
    }
    drawPops();
    // snails crawl the walls; touching one makes it duck into its shell for 5s, then reverse
    for(var s=0;s<snails.length;s++){
      var sn=snails[s]; sn.phase+=0.03;
      var wob=Math.abs(Math.sin(sn.phase))*1.5, px,py,rot;
      if(sn.wall==='bottom'){ px=30+sn.t*(W-60); py=H-8-wob; rot=0; }
      else if(sn.wall==='left'){ px=8+wob; py=30+sn.t*(H-60); rot=Math.PI/2; }
      else { px=W-8-wob; py=30+sn.t*(H-60); rot=-Math.PI/2; }
      var now=(window.performance&&performance.now)?performance.now():Date.now();
      if(mouse.active && sn.state==='crawl'){
        var dd=Math.hypot(px-mouse.x,py-mouse.y);
        if(dd<58){ sn.state='hiding'; sn.hideUntil=now+5000; sn.dir=-sn.dir; }
      }
      if(sn.state==='hiding'){
        sn.eyeOut+=(0-sn.eyeOut)*0.18;      // pull eyes in
        if(now>=sn.hideUntil){ sn.state='crawl'; }
      } else {
        sn.eyeOut+=(1-sn.eyeOut)*0.04;      // slowly push eyes back out
        var speed=sn.v*Math.max(0,sn.eyeOut-0.2);
        sn.t+=sn.dir*speed/((sn.wall==='bottom'?W:H)||1);
        if(sn.t>1){ sn.t=1; sn.dir=-1; } if(sn.t<0){ sn.t=0; sn.dir=1; }
      }
      var facing=(sn.wall==='right')?-sn.dir:sn.dir; // right wall is mirror-handed — flip so eyes lead
      drawSnail(px, py, sn.s, facing, sn.alpha, rot, sn.eyeOut);
    }
    // fish glide slowly — betta toward the cursor, clownfish away — both drifting & wavy
    for(var f=0;f<fish.length;f++){
      var fs=fish[f]; fs.phase+=0.025; fs.wag+=0.05;
      if(fs.flee){
        if(mouse.active){
          var rx=fs.x-mouse.x, ry=fs.y-mouse.y, rd=Math.hypot(rx,ry), R=230;
          if(rd<R&&rd>0.01){ var rf=(1-rd/R)*0.05; fs.vx+=(rx/rd)*rf; fs.vy+=(ry/rd)*rf; }
        }
        var ax=(fs.tx-fs.x), ay=(fs.ty-fs.y), ad=Math.hypot(ax,ay);
        if(ad<50){ fs.tx=40+Math.random()*(W-80); fs.ty=H*0.1+Math.random()*(H*0.72); }
        else { fs.vx+=(ax/ad)*0.005; fs.vy+=(ay/ad)*0.005; }
      } else {
        if(mouse.active){ fs.tx=mouse.x; fs.ty=mouse.y; }
        var bx=(fs.tx-fs.x), by=(fs.ty-fs.y), bd=Math.hypot(bx,by);
        if(bd<40){ if(!mouse.active){ fs.tx=40+Math.random()*(W-80); fs.ty=H*0.1+Math.random()*(H*0.72); } }
        else { fs.vx+=(bx/bd)*0.006; fs.vy+=(by/bd)*0.006; }
      }
      // soft walls keep them on-screen
      var m=34;
      if(fs.x<m) fs.vx+=0.02; else if(fs.x>W-m) fs.vx-=0.02;
      if(fs.y<m) fs.vy+=0.02; else if(fs.y>H-m) fs.vy-=0.02;
      var sp=Math.hypot(fs.vx,fs.vy), MAX=0.42;
      if(sp>MAX){ fs.vx*=MAX/sp; fs.vy*=MAX/sp; }
      fs.vx*=0.99; fs.vy*=0.99;
      fs.x+=fs.vx; fs.y+=fs.vy+Math.sin(fs.phase)*0.10;
      var dir=fs.vx>0?-1:1; // image faces left
      var tilt=Math.max(-0.26,Math.min(0.26,fs.vy*0.5));
      drawFish(fs.img, fs.x, fs.y, fs.w, dir, tilt, fs.alpha, fs.wag);
    }
    if(puffer){
      stepPuffer(puffer, performance.now?performance.now():Date.now());
      if(puffer.state!=='gone'){
        // Level once it is inflated: a ball does not lean into a drift it is not steering.
        var ptilt=Math.max(-0.24,Math.min(0.24,puffer.vy*0.5))*(1-puffer.q);
        drawPuffer(puffer.x, puffer.y, puffer.w, puffer.dir, ptilt, puffer.alpha, puffer.wag, puffer.q);
      }
    }
    requestAnimationFrame(loop);
  }
  /* Tapping a bubble pops it. The wallpaper is pointer-events:none so it can never swallow a
     tap meant for the app — the hit test just reads the same pointer position the drift already
     tracks, and only the nearest bubble under the finger bursts. A generous slop radius makes it
     land on a touchscreen, where the finger is far bigger than a 6px bubble. */
  function popAt(px,py){
    var best=-1, bestD=1e9;
    for(var i=0;i<bubbles.length;i++){
      var b=bubbles[i];
      var bx=b.x+Math.sin(b.phase)*b.swayA+b.ox, by=b.y+b.oy;
      var d=Math.hypot(bx-px,by-py);
      if(d<b.r+16 && d<bestD){ bestD=d; best=i; }
    }
    if(best<0) return false;
    var v=bubbles[best];
    pops.push({x:v.x+Math.sin(v.phase)*v.swayA+v.ox, y:v.y+v.oy, r:v.r, t:0});
    // Retire the popped bubble and send a fresh one up from below, so the count stays steady.
    Object.assign(v,mk()); v.y=H+v.r+Math.random()*40;
    return true;
  }
  function drawPops(){
    for(var i=pops.length-1;i>=0;i--){
      var p=pops[i]; p.t+=0.045;
      if(p.t>=1){ pops.splice(i,1); continue; }
      var e=1-Math.pow(1-p.t,2);          // fast out, slow settle
      var a=(1-p.t)*0.55;
      // the shell blowing outwards
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r*(1+e*1.9),0,Math.PI*2);
      ctx.strokeStyle='rgba(52,168,202,'+a+')'; ctx.lineWidth=Math.max(1.2,p.r*0.34*(1-p.t)); ctx.stroke();
      // and the droplets it throws off
      for(var k=0;k<6;k++){
        var ang=(Math.PI*2/6)*k+p.r, dist=p.r*(0.9+e*2.4);
        ctx.beginPath();
        ctx.arc(p.x+Math.cos(ang)*dist, p.y+Math.sin(ang)*dist, Math.max(0.6,p.r*0.22*(1-p.t)), 0, Math.PI*2);
        ctx.fillStyle='rgba(74,187,220,'+(a*1.5)+')'; ctx.fill();
      }
    }
  }
  window.addEventListener('pointerdown',function(e){ mouse.x=e.clientX; mouse.y=e.clientY; mouse.active=true; if(!puffAt(e.clientX,e.clientY)) popAt(e.clientX,e.clientY); },{passive:true});
  window.addEventListener('resize',resize,{passive:true});
  window.addEventListener('pointermove',function(e){ mouse.x=e.clientX; mouse.y=e.clientY; mouse.active=true; },{passive:true});
  window.addEventListener('pointerout',function(e){ if(!e.relatedTarget){ mouse.active=false; } });
  // start the loop at most once — prevents multiple rAF loops stacking (which made the fish speed up over time)
  function start(){ if(looping||!running||reduce) return; looping=true; requestAnimationFrame(loop); }
  document.addEventListener('visibilitychange',function(){ running=!document.hidden; if(running) start(); });
  resize();
  if(reduce){ ctx.clearRect(0,0,W,H); bg();
    for(var i=0;i<bubbles.length;i++){ var b=bubbles[i]; drawBubble(b.x,b.y,b.r,b.alpha); }
    drawSnail(W*0.4,H-8,14,1,0.6,0,1);
    (function(){
      var w=window.innerWidth<560?Math.max(44,Math.round(window.innerWidth*0.14)):78;
      loadFish();
      var rdz=function(){ drawFish(bettaImg,W*0.55,H*0.32,w,1,0,0.92,0); drawFish(clownImg,W*0.7,H*0.5,Math.round(w*0.92),-1,0,0.92,0);
        drawPuffer(W*0.32,H*0.62,Math.round(w*0.86),-1,0,0.92,0,0); };
      bettaImg.onload=rdz; clownImg.onload=rdz; rdz();
    })();
  }
  else { start(); }
})();
</script>

<!-- ══ Drifting jellyfish — a couple of them, roaming the whole screen ══
     They wander the way the betta and the clownfish do: each picks a spot at random, swims
     over to it and picks another, so they cross the same water more than once instead of
     running one-way traffic from the bottom edge to the top. Built as an SVG (not a flat
     image) so the bell can actually contract and the tentacles trail: a real jellyfish swims
     by squeezing its bell to surge, then glides while it relaxes. -->
<div id="nemo-jelly" aria-hidden="true"></div>
<style>
  #nemo-jelly{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;}
  #nemo-jelly svg{position:absolute;left:0;top:0;will-change:transform;}
  /* Fine ripple along each tentacle, staggered so they don't move as one rigid comb. */
  @keyframes jellyTentacle{0%,100%{transform:translateX(0) scaleY(1)}50%{transform:translateX(2.5px) scaleY(1.05)}}
  .jt{transform-box:fill-box;transform-origin:top center;animation:jellyTentacle 4.6s ease-in-out infinite;}
  @media(prefers-reduced-motion:reduce){#nemo-jelly{display:none;}}
</style>
<script>
(function(){
  var host=document.getElementById('nemo-jelly'); if(!host) return;
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  // ── Artwork ────────────────────────────────────────────────────────────────
  // Drawn from the reference the owner supplied: a periwinkle bell marbled with cream, a soft
  // violet outline, small round eyes with one highlight each, blush and a barely-there smile.
  // No star sparkles, no open mouth. Frilled cream oral arms hang in the middle and ten long
  // thin tentacles trail well past them — that length is most of the silhouette.
  // Grouped so the bell, arms and tentacles animate separately.
  function svg(uid){
    var g='jg'+uid, t='jt'+uid, a='ja'+uid;
    /* Five tentacle curves, each drawn once and then again inside a mirrored group, so the
       two sides trail away from each other instead of combing the same way. Writing them out
       twice by hand is how the old set ended up subtly asymmetric. */
    var TENT=[[34,'c-10 44-7 96 2 138 5 26 2 48-8 66'],
              [52,'c-7 46-4 100 4 142 4 24 1 44-7 60'],
              [70,'c-5 48-2 104 4 146 3 22 1 40-5 54'],
              [86,'c-3 50-1 106 3 150 2 20 1 36-4 48'],
              [97,'c-1 52 0 108 2 152 1 18 0 32-3 42']];
    function side(mirror){
      var out=mirror?'<g transform="translate(200,0) scale(-1,1)">':'<g>';
      for(var i=0;i<TENT.length;i++){
        var delay=-(i*0.7+(mirror?0.35:0));
        out+='<path class="jt" style="animation-delay:'+delay.toFixed(2)+'s" d="M'+TENT[i][0]+' 108'+TENT[i][1]+
             '" stroke="url(#'+t+')" stroke-width="4.6" stroke-linecap="round" fill="none"/>';
      }
      return out+'</g>';
    }
    return ''+
    '<svg width="200" height="380" viewBox="0 0 200 380" fill="none" xmlns="http://www.w3.org/2000/svg">'+
      '<defs>'+
        '<linearGradient id="'+g+'" x1="0" y1="0" x2="0" y2="1">'+
          '<stop offset="0%" stop-color="#c6cbec"/><stop offset="55%" stop-color="#bcc2e8"/>'+
          '<stop offset="100%" stop-color="#b3b9e2"/></linearGradient>'+
        '<linearGradient id="'+t+'" x1="0" y1="0" x2="0" y2="1">'+
          '<stop offset="0%" stop-color="#a3abd8"/><stop offset="100%" stop-color="#c2c8ea"/></linearGradient>'+
        '<linearGradient id="'+a+'" x1="0" y1="0" x2="0" y2="1">'+
          '<stop offset="0%" stop-color="#fbf4dd"/><stop offset="70%" stop-color="#efeee2"/>'+
          '<stop offset="100%" stop-color="#c9cfe8"/></linearGradient>'+
      '</defs>'+
      '<g class="jelly-tents">'+side(false)+side(true)+'</g>'+
      '<g class="jelly-arms">'+
        // two frilled oral arms either side of a longer one down the middle
        '<path d="M84 112c-10 30-15 64-12 96 2 22-2 42-10 58 14-6 22-22 26-42 5-26 6-76 3-112z" fill="url(#'+a+')" stroke="#6f6a99" stroke-width="3" stroke-linejoin="round"/>'+
        '<path d="M116 112c10 30 15 64 12 96-2 22 2 42 10 58-14-6-22-22-26-42-5-26-6-76-3-112z" fill="url(#'+a+')" stroke="#6f6a99" stroke-width="3" stroke-linejoin="round"/>'+
        '<path d="M100 116c-7 34-9 78-5 114 3 24 1 44-4 60 12-8 18-26 20-50 3-34 2-90-3-124z" fill="url(#'+a+')" stroke="#6f6a99" stroke-width="3" stroke-linejoin="round"/>'+
      '</g>'+
      '<g class="jelly-bell">'+
        // dome with a soft scalloped hem
        '<path d="M16 108c0-50 38-90 84-90s84 40 84 90c0 6-4 10-9 8-5 6-13 7-18 1-5 6-13 7-18 1-5 6-13 7-18 1-5 6-13 7-18 1-5 6-13 7-18 1-5 6-13 7-18 1-5 6-13 7-18-1-5 2-9-2-9-8z" fill="url(#'+g+')" stroke="#565081" stroke-width="4" stroke-linejoin="round"/>'+
        // cream marbling running down from the crown
        '<path d="M100 24c6 0 10 6 9 16-2 14-4 26-3 38 1 8-2 13-6 13s-7-5-6-13c2-13 1-26 0-38-1-10 1-16 6-16z" fill="#f8f2da" opacity=".85"/>'+
        '<path d="M67 32c5-2 8 3 7 11-2 13-7 23-9 35-2 8-6 11-9 9s-3-8-1-14c4-13 6-23 6-32 0-5 1-8 6-9z" fill="#f8f2da" opacity=".7"/>'+
        '<path d="M133 32c-5-2-8 3-7 11 2 13 7 23 9 35 2 8 6 11 9 9s3-8 1-14c-4-13-6-23-6-32 0-5-1-8-6-9z" fill="#f8f2da" opacity=".7"/>'+
        '<circle cx="42" cy="86" r="3.4" fill="#f8f2da" opacity=".75"/>'+
        '<circle cx="158" cy="86" r="3.4" fill="#f8f2da" opacity=".75"/>'+
        '<circle cx="53" cy="63" r="2.6" fill="#f8f2da" opacity=".6"/>'+
        // gloss
        '<path d="M42 72c6-21 22-35 39-39-14 11-25 25-29 43-2.4 8.6-12.6 6-10-4z" fill="#fff" opacity=".55"/>'+
        // face — small round eyes, one highlight each, blush outside them, a whisper of a smile
        '<ellipse cx="55" cy="100" rx="11" ry="6" fill="#eaa9bd" opacity=".5"/>'+
        '<ellipse cx="145" cy="100" rx="11" ry="6" fill="#eaa9bd" opacity=".5"/>'+
        '<circle cx="78" cy="90" r="8.4" fill="#2f2b45"/>'+
        '<circle cx="122" cy="90" r="8.4" fill="#2f2b45"/>'+
        '<circle cx="75" cy="86.5" r="2.9" fill="#fff"/>'+
        '<circle cx="119" cy="86.5" r="2.9" fill="#fff"/>'+
        '<path d="M92 101c3 4 13 4 16 0" stroke="#565081" stroke-width="2.6" stroke-linecap="round" fill="none" opacity=".8"/>'+
      '</g>'+
    '</svg>';
  }

  // ── Pointer / touch: getting close wakes it up ─────────────────────────────
  // The layer is pointer-events:none (it must never eat a tap), so proximity is measured
  // against the pointer rather than using hover. A tap stays "hot" for a moment, since a
  // touch is instantaneous and otherwise nothing would register.
  var ptr={x:-9999,y:-9999,until:0};
  function markPtr(x,y,ms){ ptr.x=x; ptr.y=y; ptr.until=(performance.now?performance.now():Date.now())+ms; }
  window.addEventListener('pointermove',function(e){ markPtr(e.clientX,e.clientY,220); },{passive:true});
  window.addEventListener('pointerdown',function(e){ markPtr(e.clientX,e.clientY,1600); },{passive:true});
  window.addEventListener('touchstart',function(e){ var t=e.touches&&e.touches[0]; if(t) markPtr(t.clientX,t.clientY,1600); },{passive:true});
  window.addEventListener('touchmove',function(e){ var t=e.touches&&e.touches[0]; if(t) markPtr(t.clientX,t.clientY,400); },{passive:true});

  // ── Two drifters, roaming the whole screen ─────────────────────────────────
  /* They used to run one-way crossings: in at the bottom, out at the top, gone. That reads as
     traffic rather than as an aquarium — the same journey every time, and never once passing
     back through where you were looking. They swim like the betta and the clownfish now: each
     one picks a spot at random, wanders over to it, picks another, and never leaves. The swim
     itself is unchanged — a bell contraction that surges it forward, then a long glide while
     the bell refills — it just steers along its own heading now instead of straight up. */
  var MAX=2;
  var uid=0, live=[], raf=0, running=true, last=0, sized=false;

  // Somewhere new to be. Kept off the very edges so a target never parks it against a wall.
  function retarget(jf,W,H){
    var m=Math.max(40,jf.w);
    jf.tx=m+Math.random()*Math.max(1,W-m*2);
    jf.ty=H*0.10+Math.random()*Math.max(1,H*0.70);
    jf.tAt=(performance.now?performance.now():Date.now())+9000+Math.random()*9000;
  }

  // Two entering side by side reads as a pair rather than as drift, so a new one keeps clear
  // of whatever is already in the water.
  function crowded(x,W){
    for(var i=0;i<live.length;i++) if(Math.abs(live[i].cx-x)<W*0.3) return true;
    return false;
  }

  function spawn(W,H){
    uid++;
    // The betta and clownfish in the wallpaper render 72-78px wide; keep this well under half
    // of that. The bell is ~84% of the SVG width, so a 34px svg gives a ~29px bell.
    var w=26+Math.random()*7, h=w*(380/200);
    var box=document.createElement('div');
    box.innerHTML=svg(uid);
    var el=box.firstChild;
    host.appendChild(el);                          // append — never wipe the other drifter
    el.style.width=w+'px'; el.style.height=h+'px';
    var m=w*0.7, span=Math.max(40,W-w*1.4), x0=m+Math.random()*span;
    for(var a=0; a<8 && crowded(x0,W); a++) x0=m+Math.random()*span;
    var jf={
      el:el, w:w, h:h,
      cx:x0, cy:H*0.15+Math.random()*H*0.6,        // bell centre, in page coordinates
      vx:(Math.random()-0.5)*8, vy:(Math.random()-0.5)*8,
      tx:0, ty:0, tAt:0,
      baseCx:x0, push:0, pushDir:0,
      vxs:0,                                       // smoothed sideways speed, for the bank
      swayHz:0.012+Math.random()*0.008,            // one slow cycle over many seconds
      swayPh:Math.random()*Math.PI*2,
      amp:3+Math.random()*3,                       // fine jitter on top of the steering
      pulseT:Math.random(),                        // where in the swim stroke it starts
      pulseDur:2.5+Math.random()*0.9,              // seconds per contraction cycle
      act:0,                                       // 0 = calm drift, 1 = stirred up by the pointer
      bell:el.querySelector('.jelly-bell'),
      arms:el.querySelector('.jelly-arms'),
      tents:el.querySelector('.jelly-tents')
    };
    retarget(jf,W,H);
    // keep the artwork's own origin sensible for squash/stretch
    if(jf.bell){ jf.bell.style.transformBox='fill-box'; jf.bell.style.transformOrigin='center bottom'; }
    if(jf.arms){ jf.arms.style.transformBox='fill-box'; jf.arms.style.transformOrigin='top center'; }
    if(jf.tents){ jf.tents.style.transformBox='fill-box'; jf.tents.style.transformOrigin='top center'; }
    live.push(jf);
    return jf;
  }

  // One drifter, one frame.
  function step(jf,dt,now,W,H){
    // Swim stroke first — it decides how hard this frame can push. A contraction drives it
    // forward; the long recovery that follows is a glide with nothing behind it, which is what
    // makes a jellyfish look like a jellyfish rather than something being dragged on a string.
    jf.pulseT+=dt/(jf.pulseDur/(1+jf.act*1.15)); if(jf.pulseT>1) jf.pulseT-=1;
    var p=jf.pulseT, contract=0.42, thrust, squash;
    if(p<contract){
      var k=p/contract;
      thrust=Math.sin(k*Math.PI);
      squash=Math.sin(k*Math.PI);
    } else {
      var r=(p-contract)/(1-contract);
      thrust=0;
      squash=-0.35*Math.sin(r*Math.PI);            // slight over-relax, like a bell refilling
    }

    // Steer toward the spot it chose. Arriving, or simply having spent long enough on one
    // heading, sends it somewhere else.
    var ax=jf.tx-jf.cx, ay=jf.ty-jf.cy, ad=Math.hypot(ax,ay);
    if(ad<45||now>jf.tAt){ retarget(jf,W,H); ax=jf.tx-jf.cx; ay=jf.ty-jf.cy; ad=Math.hypot(ax,ay)||1; }
    var drive=45*(1+jf.act*1.5)*thrust;            // px/s², and only while the bell is squeezing
    jf.vx+=(ax/ad)*drive*dt;
    jf.vy+=(ay/ad)*drive*dt;

    // Soft walls, in case a resize leaves it outside its own target range.
    var mx=jf.w*0.7, myTop=jf.h*0.10, myBot=Math.max(myTop,H-jf.h*0.15);
    if(jf.cx<mx) jf.vx+=34*dt; else if(jf.cx>W-mx) jf.vx-=34*dt;
    if(jf.cy<myTop) jf.vy+=34*dt; else if(jf.cy>myBot) jf.vy-=34*dt;

    // The glide. Water drags it down to a stall between strokes, which is the whole point.
    var damp=Math.pow(0.68,dt);
    jf.vx*=damp; jf.vy*=damp;
    var sp=Math.hypot(jf.vx,jf.vy), MAXV=24*(1+jf.act*0.8);
    if(sp>MAXV){ jf.vx*=MAXV/sp; jf.vy*=MAXV/sp; }
    jf.cx+=jf.vx*dt; jf.cy+=jf.vy*dt;

    // A slow sway on top, so a long straight run to a distant target still breathes.
    jf.swayPh+=dt*Math.PI*2*jf.swayHz;
    var sway=Math.sin(jf.swayPh);
    jf.baseCx=jf.cx+sway*jf.amp;

    // Their paths are independent, so two of them can converge mid-screen — which reads as a
    // collision, not as drift. Ease them apart as they close: nothing at arm's length, growing
    // smoothly the nearer they get, and both feel it so the gap opens twice as fast. The side
    // is settled once on first approach — recompute it every frame and the direction inverts
    // the instant they cross, which snaps them apart instead of parting them.
    var want=0, meeting=false;
    for(var q=0;q<live.length;q++){
      var o=live[q]; if(o===jf) continue;
      var ddx=jf.baseCx-o.baseCx, dist=Math.hypot(ddx,jf.cy-o.cy), R=200;
      if(dist<R){
        meeting=true;
        if(!jf.pushDir) jf.pushDir=(ddx||(jf.cx-o.cx)||1)>0?1:-1;   // commit to a side
        var f=1-dist/R;
        want+=jf.pushDir*f*f*36;
      }
    }
    if(!meeting) jf.pushDir=0;            // clear of each other — ready to decide afresh
    jf.push+=(want-jf.push)*0.04;
    var cx=jf.baseCx+jf.push;
    var lo=jf.w*0.6, hi=Math.max(lo,W-jf.w*0.6);
    if(cx<lo) cx=lo; else if(cx>hi) cx=hi;

    /* Banks toward wherever it's actually heading, held to a small angle: with tentacles this
       long, anything more reads as a jellyfish falling over.

       Read straight off the velocity rather than differentiated from the rendered position.
       The rendered position carries the sway and the separation nudge, and on a jelly's very
       first frame the sway starts at a random phase — so the difference against the spawn
       point was a jump of several pixels in one frame, which divided by dt looked like several
       hundred px/s and left the smoothed value pinned at the clamp for a minute afterwards.
       Every jellyfish swam permanently keeled over. The velocity has no such discontinuity. */
    jf.vxs+=(jf.vx-jf.vxs)*0.06;
    var lean=Math.max(-10,Math.min(10,jf.vxs*0.42));

    // Pointer nearby (or a recent tap) stirs it up: it pulses harder and swims quicker, then
    // settles back to its calm drift. Wakes fast, calms slowly — like a startled animal.
    var near=0;
    if(now<ptr.until){
      var d=Math.hypot(ptr.x-cx, ptr.y-jf.cy), R2=78;
      if(d<R2) near=1-d/R2;
    }
    jf.act+=(near-jf.act)*(near>jf.act?0.16:0.015);

    var x=cx-jf.w/2, y=jf.cy-jf.h*0.18;   // the bell centre sits ~18% down the artwork
    jf.el.style.transform='translate3d('+x.toFixed(1)+'px,'+y.toFixed(1)+'px,0) rotate('+lean.toFixed(2)+'deg)';
    // Bell works harder when it's stirred up.
    var amp=1+jf.act*0.45;
    if(jf.bell) jf.bell.style.transform='scale('+(1+squash*0.10*amp).toFixed(3)+','+(1-squash*0.16*amp).toFixed(3)+')';
    // arms and tentacles lag the bell — they're dragged, not driven
    var lag=Math.sin((p-0.16)*Math.PI*2);
    if(jf.arms)  jf.arms.style.transform='scaleY('+(1+lag*0.07*amp).toFixed(3)+') skewX('+(sway*1.6).toFixed(2)+'deg)';
    if(jf.tents) jf.tents.style.transform='scaleY('+(1+lag*0.10*amp).toFixed(3)+') skewX('+(sway*2.6).toFixed(2)+'deg)';
  }

  function frame(now){
    if(!running){ raf=0; return; }
    if(!last) last=now;
    var dt=Math.min(0.05,(now-last)/1000); last=now;
    var W=window.innerWidth, H=window.innerHeight;
    if(!sized){ sized=true; for(var i=0;i<MAX;i++) spawn(W,H); }
    for(var s=0;s<live.length;s++) step(live[s],dt,now,W,H);
    raf=requestAnimationFrame(frame);
  }

  function start(){ if(raf||!running) return; last=0; raf=requestAnimationFrame(frame); }
  document.addEventListener('visibilitychange',function(){
    running=!document.hidden;
    if(!running){ if(raf) cancelAnimationFrame(raf); raf=0; }
    else start();
  });
  // Narrowing the window must not strand one off-screen — pull it, and wherever it was
  // heading, back inside the new frame.
  window.addEventListener('resize',function(){
    var W=window.innerWidth, H=window.innerHeight;
    for(var i=0;i<live.length;i++){
      var d=live[i], m=d.w*0.7, hi=Math.max(m,W-m);
      d.cx=Math.min(hi,Math.max(m,d.cx));
      d.cy=Math.min(Math.max(0,H-d.h*0.15),Math.max(d.h*0.10,d.cy));
      retarget(d,W,H);
    }
  },{passive:true});
  start();
})();
</script>
</body>
</html>
